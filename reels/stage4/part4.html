<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Stage 4 · 45–60 s</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../shared/frame.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/style.js"></script>
<script src="../shared/hero.js"></script>
<script src="../shared/subs.js"></script>
<script src="../shared/scene.js"></script>
</head>
<body>
<div id="frame"></div>
<script>
(function () {
const S = STYLE, P = S.PAL, E = S.E, el = S.el, FPS = 30;
const SC = SCENE.init({ stage: 4, duration: 15, music: { bpm: 90, key: 'Dm', drops: [], tail: true } });
const tl = SC.tl, svg = SC.svg;
const faceAt = (list, t) => list.filter(f => f[0] <= t + 1e-6).pop();

/* ---------- hill above the night city ---------- */
function nightHill(w, o) {
  el('rect', { x: -600, y: -600, width: 2400, height: 3200, fill: S.linGrad(svg, [[0, P.sky0], [0.62, P.sky1], [1, P.sky1]]) }, w);
  SC.stars(w, { n: 60, x0: -100, x1: 1180, y0: 120, y1: o.horizon - 260, seed: o.seed || 9 });
  const far = SC.city(w, { x0: -300, x1: 1400, base: o.horizon + 60, seed: 91, gap: [2, 10], layers: [{ col: S.back(P.sky1, 1), h: [140, 330], w: [60, 120], lit: .35, density: .55, win: 10, gap: 10 }] });
  const near = SC.city(w, { x0: -300, x1: 1400, base: o.horizon + 120, seed: 92, gap: [2, 14], layers: [{ col: S.back(P.wall, 1), h: [90, 230], w: [90, 160], lit: .45, density: .6, win: 12, gap: 11 }] });
  // road with moving car lights (the city keeps moving)
  el('rect', { x: -300, y: o.horizon + 110, width: 1700, height: 16, fill: S.back(P.floor, 2) }, w);
  const cars = []; const r = S.rng(93);
  for (let i = 0; i < 7; i++) { const c = el('rect', { y: o.horizon + 112, width: 22, height: 8, rx: 4, fill: i % 2 ? P.win : P.coral }, w); cars.push({ c, x0: r.range(-300, 1300), v: (i % 2 ? 1 : -1) * r.range(60, 110) }); }
  SC.on(t => cars.forEach(k => { let x = k.x0 + k.v * t; x = ((x + 300) % 1700 + 1700) % 1700 - 300; k.c.setAttribute('x', x); }));
  // windows breathe slowly on and off
  const wins = far.wins.concat(near.wins); const wr = S.rng(94); wins.forEach(o2 => { o2.ph = wr() * 6.28; o2.sp = wr.range(0.15, 0.4); });
  SC.on(t => wins.forEach(o2 => { const k = 0.5 + 0.5 * Math.sin(o2.ph + t * o2.sp * 6.28); o2.e.setAttribute('fill', o2.lit0 ? S.mix(o2.off, o2.on, 0.55 + 0.45 * k) : S.mix(o2.off, o2.on, Math.max(0, k - 0.75) * 2)); }));
  // the hill
  el('path', { d: `M-600,${o.horizon + 260}C-100,${o.crest + 40} 400,${o.crest - 20} 760,${o.crest}C1000,${o.crest + 10} 1300,${o.crest + 120} 1700,${o.horizon + 220}L1700,2600L-600,2600Z`, fill: P.sky1 }, w);
  el('path', { d: `M-600,${o.horizon + 330}C-100,${o.crest + 110} 400,${o.crest + 50} 760,${o.crest + 70}C1000,${o.crest + 80} 1300,${o.crest + 190} 1700,${o.horizon + 290}L1700,2600L-600,2600Z`, fill: S.shade(P.sky1, 0.12) }, w);
  // one bare tree
  if (o.tree) {
    const [tx, ty] = o.tree, tg = el('g', { transform: `translate(${tx},${ty})` }, w), tc = S.back(P.violet, 2);
    el('path', { d: 'M-18,0L-12,-260Q-10,-300 0,-330L10,-300Q14,-260 18,0Z', fill: tc }, tg);
    [['M-6,-200Q-60,-260 -120,-300', 14], ['M0,-250Q50,-320 110,-350', 12], ['M-4,-300Q-30,-370 -40,-420', 10], ['M4,-310Q40,-380 30,-440', 9], ['M-80,-268Q-110,-330 -100,-370', 7], ['M70,-322Q120,-340 150,-320', 7]].forEach(([d, sw]) => el('path', { d, fill: 'none', stroke: tc, 'stroke-width': sw, 'stroke-linecap': 'round' }, tg));
  }
}

SC.start(() => {
  const F = SC.F, W = SC.W;
  const tMv = W('Mavjudligingning'), tU = W('U'), tSh = W('Shunday');
  SC.music.major_from = tMv;

  /* =================== SHOT 13 · hill above the city; he drains to an outline =================== */
  const s13 = SC.shot({ name: 'S13 hill drain', f0: 0, cueWord: 'Demak' });
  nightHill(s13.w, { horizon: 1240, crest: 1480, tree: [180, 1500] });
  const hero = HERO.create(svg, s13.w, { id: 'hero', seed: 401 });
  Object.assign(hero.pose, { x: 640, y: 1505, s: 0.8, back: 1, sit: 1, wind: 1, aL1: 30, aL2: -40, aR1: -30, aR2: 40, lineColor: P.paper, lineW: 3 });
  const tBm = W('boʻlmasang');
  const sat = { v: 1 };
  tl.to(hero.pose, { fill: 0, dash: 1, duration: 10 / FPS, ease: E.inOutSine }, tBm);
  tl.to(sat, { v: 0.5, duration: 10 / FPS, ease: E.inOutSine }, tBm);
  SC.cue(tBm, 'drain', { dur: 0.6 }); SC.cue(0, 'wind', { dur: tMv + 0.3 });
  SC.on(t => { hero.setFace('neutral'); hero.apply(t); s13.g.style.filter = sat.v < 0.999 ? `saturate(${sat.v})` : ''; });
  tl.fromTo(s13.camState, { x: 540, y: 1060, s: 1.0 }, { x: 570, y: 1080, s: 1.04, duration: tMv, ease: E.inOutSine }, 0);

  /* =================== SHOT 14 · close on chest and face: a spark re-ignites the light =================== */
  const s14 = SC.shot({ name: 'S14 re-ignite', f0: F('Mavjudligingning'), cueWord: 'Mavjudligingning', cut: 'hard' });
  nightHill(s14.w, { horizon: 900, crest: 1250, seed: 15 });
  const h14 = HERO.create(svg, s14.w, { id: 'h14', seed: 402 });
  const HS = 1.9;
  Object.assign(h14.pose, { x: 540, y: 820 + 648 * HS, s: HS, fill: 0, dash: 1, lineColor: P.paper, lineW: 3, wind: 0.6 });
  const light = SC.innerLight(h14.slots.chest, { x: 0, y: 0 }); light.st.k = 0;
  const spark = el('path', { d: 'M0,-46L9,-9L46,0L9,9L0,46L-9,9L-46,0L-9,-9Z', fill: P.paper }, s14.w);
  const spSt = { p: 0 };
  const sat14 = { v: 0.5 };
  const tSpark = tMv + 10 / FPS;
  tl.fromTo(spSt, { p: 0 }, { p: 1, duration: 4 / FPS, ease: E.outCubic }, tSpark - 4 / FPS);
  tl.to(spSt, { p: 0, duration: 6 / FPS, ease: E.inCubic }, tSpark + 2 / FPS);
  SC.cue(tSpark, 'spark');
  tl.fromTo(light.st, { k: 0, s: 0.5 }, { k: 1, s: 1, duration: 8 / FPS, ease: E.outBack }, tSpark);
  tl.to(h14.pose, { fill: 1, dash: 0, duration: 12 / FPS, ease: E.inOutSine }, tSpark + 2 / FPS);
  tl.to(sat14, { v: 1, duration: 12 / FPS, ease: E.inOutSine }, tSpark + 2 / FPS);
  SC.cue(tSpark + 2 / FPS, 'swell', { dur: 0.5, gain: 0.7 });
  const tYo = W('yorugʻlik');
  const grow = 120 / (18 * HS);                       // core r 18 → 120 on screen
  tl.to(light.st, { s: grow, duration: 18 / FPS, ease: E.outCubic }, tYo);
  SC.cue(tYo + 14 / FPS, 'swell', { dur: 0.9 });
  const warm = el('ellipse', { cx: 540, cy: 820, rx: 330, ry: 340, fill: S.radGrad(svg, S.softStops(P.win, 0.25)) }, s14.w);
  const wSt = { k: 0 };
  tl.to(wSt, { k: 1, duration: 18 / FPS, ease: E.outCubic }, tYo);
  const faces14 = [[0, 'sad'], [tSpark + 4 / FPS, 'wonder'], [tYo + 6 / FPS, 'blissful']];
  SC.on(t => {
    h14.setFace(faceAt(faces14, t)[1]); h14.apply(t);
    const [cx, cy] = [540, 820 + (-420 + 648) * HS];
    spark.setAttribute('transform', `translate(${cx},${cy}) scale(${spSt.p}) rotate(${spSt.p * 45})`); spark.style.opacity = spSt.p > 0.01 ? 1 : 0;
    s14.g.style.filter = sat14.v < 0.999 ? `saturate(${sat14.v})` : '';
    warm.setAttribute('opacity', wSt.k);
  });
  tl.fromTo(s14.camState, { x: 540, y: 1000, s: 1.0 }, { x: 540, y: 960, s: 1.05, duration: tU - tMv, ease: E.inOutSine }, tMv);

  /* =================== SHOT 15 · aerial city: every window pulses warm =================== */
  const s15 = SC.shot({ name: 'S15 aerial city', f0: F('U'), cueWord: 'U', cut: 'hard' });
  const awins = [];
  {
    const w = s15.w;
    el('rect', { x: -600, y: -600, width: 2400, height: 3200, fill: S.linGrad(svg, [[0, S.back(P.floor, 2)], [1, S.back(P.floor, 1)]]) }, w);
    const r = S.rng(151);
    // rows of buildings seen from above at an angle: roofs + a lit front face, far rows smaller/darker
    for (let row = 0; row < 15; row++) {
      const depth = row / 14, sc = 0.55 + depth * 0.65, y = 120 + row * 150 * (0.7 + depth * 0.5);
      const col = S.mix(S.back(P.wall, 2), P.wall, depth), roof = S.mix(S.back(P.violet, 2), S.back(P.violet, 1), depth);
      let x = -300 + r.range(0, 120);
      while (x < 1400) {
        const bw = r.range(120, 220) * sc, bh = r.range(70, 140) * sc;
        el('path', { d: S.rrect(x, y - bh * 0.5, bw, bh * 0.5, 8 * sc), fill: roof }, w);
        el('rect', { x, y, width: bw, height: bh, fill: col }, w);
        for (let wy = y + 10 * sc; wy < y + bh - 14 * sc; wy += 22 * sc) for (let wx = x + 10 * sc; wx < x + bw - 16 * sc; wx += 22 * sc) {
          const e = el('rect', { x: wx, y: wy, width: 12 * sc, height: 14 * sc, rx: 2, fill: S.back(P.win, 2) }, w);
          awins.push({ e, x: wx, y: wy, off: S.mix(col, P.win, 0.18) });
        }
        el('rect', { x: x - 2, y: y + bh, width: bw + 4, height: 10 * sc, fill: P.ink, opacity: .25 }, w);
        x += bw + r.range(30, 70) * sc;
      }
    }
  }
  // far rows recede into darkness (depth by value) — keeps the subtitle band calm
  el('rect', { x: 0, y: 0, width: 1080, height: 760, fill: S.linGrad(svg, [[0, P.ink, 0.86], [0.55, P.ink, 0.7], [1, P.ink, 0]]) }, s15.g);
  const C = [540, 1050];
  SC.on(t => {
    if (t < tU - 0.01) return;
    const tt = t - tU;
    awins.forEach(o => {
      const d = Math.hypot(o.x - C[0], (o.y - C[1]) * 1.3);
      const wave = 0.5 + 0.5 * Math.sin(tt * 2.4 - d / 140);
      const on = S.clamp((tt * 900 - d) / 220);                   // first the wave reaches it, then it breathes
      o.e.setAttribute('fill', S.mix(o.off, P.win, on * (0.45 + 0.55 * wave)));
    });
  });
  for (let k = 0; k < 8; k++) SC.cue(tU + 0.12 + k * 0.17, 'chime', { i: k, major: true, gain: 0.8, pan: -0.6 + k * 0.17 });
  tl.fromTo(s15.camState, { x: 540, y: 1000, s: 1.08, r: -2 }, { x: 560, y: 960, s: 1.0, r: 1, duration: tSh - tU, ease: E.inOutSine }, tU);

  /* =================== SHOT 16 · hill + CTA card; he taps "Obuna boʻling" =================== */
  const s16 = SC.shot({ name: 'S16 CTA', f0: F('Shunday'), cueWord: 'Shunday', cut: 'hard' });
  nightHill(s16.w, { horizon: 1300, crest: 1640, tree: [940, 1700], seed: 19 });
  const h16 = HERO.create(svg, s16.w, { id: 'h16', seed: 403 });
  Object.assign(h16.pose, { x: 255, y: 1700, s: 0.85, wind: 0.5 });
  // CTA card (screen space: text never moves while read)
  const card = el('g', { 'data-check': 'label' }, s16.scr);
  const cardIn = el('g', {}, card);
  el('rect', { x: -380, y: -150, width: 760, height: 300, rx: 46, fill: P.paper }, cardIn);
  const brand = el('text', { 'font-family': 'Montserrat', 'font-weight': 800, 'font-size': 64, fill: P.ink, 'text-anchor': 'middle', 'dominant-baseline': 'central', y: -58 }, cardIn); brand.textContent = 'dangasa_ai';
  const btn = el('g', { transform: 'translate(0,56)' }, cardIn);
  const btnIn = el('g', {}, btn);
  const btnBg = el('rect', { x: -200, y: -42, width: 400, height: 84, rx: 42, fill: P.coral }, btnIn);
  const btnTx = el('text', { 'font-family': 'Montserrat', 'font-weight': 700, 'font-size': 40, fill: '#FFFFFF', 'text-anchor': 'middle', 'dominant-baseline': 'central', y: 2 }, btnIn); btnTx.textContent = 'Obuna boʻling';
  const tick = el('path', { d: 'M-14,0L-4,10L16,-12', fill: 'none', stroke: '#FFFFFF', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: 'translate(-158,2)' }, btnIn);
  const CARD = [540, 840];
  const cSt = { y: 200, o: 0, press: 1, green: 0 };
  tl.fromTo(cSt, { y: 200 }, { y: 0, duration: 18 / FPS, ease: E.outQuint }, tSh);
  tl.fromTo(cSt, { o: 0 }, { o: 1, duration: 6 / FPS, ease: E.outCubic }, tSh);
  SC.cue(tSh + 4 / FPS, 'slide', { dur: 0.5, gain: 0.8 });
  const tOb = W('obuna');
  // jump-tap: crouch (anticipation), hop, press 0.95 at the top, land with squash
  const tap = h16.ik('R', 155, -705, true), wave = h16.ik('R', 150, -790, true);
  tl.to(h16.pose, { sy: 0.9, sx: 1.05, duration: 4 / FPS, ease: E.inCubic }, tOb - 12 / FPS);
  tl.to(h16.pose, { sy: 1.05, sx: 0.97, hop: 180, duration: 8 / FPS, ease: E.outCubic }, tOb - 8 / FPS);
  tl.to(h16.pose, { aR1: tap.a1, aR2: tap.a2, duration: 8 / FPS, ease: E.outCubic }, tOb - 8 / FPS);
  tl.to(h16.pose, { hop: 0, sy: 1, sx: 1, duration: 8 / FPS, ease: E.inCubic }, tOb + 2 / FPS);
  tl.to(h16.pose, { sy: 0.85, sx: 1.15, duration: 2 / FPS, ease: E.outCubic }, tOb + 10 / FPS);
  tl.to(h16.pose, { sy: 1, sx: 1, duration: 12 / FPS, ease: E.spring(0.6) }, tOb + 12 / FPS);
  SC.cue(tOb - 8 / FPS, 'hop'); SC.cue(tOb + 10 / FPS, 'land', { gain: 0.6, pan: -0.4 });
  tl.set(h16.pose, { handR: 'point' }, tOb - 6 / FPS);
  tl.to(cSt, { press: 0.95, duration: 2 / FPS, ease: E.outCubic }, tOb);
  tl.to(cSt, { press: 1, duration: 8 / FPS, ease: E.spring(0.6) }, tOb + 2 / FPS);
  tl.set(cSt, { green: 1 }, tOb + 1 / FPS);
  SC.cue(tOb, 'click'); SC.cue(tOb + 3 / FPS, 'ding', { gain: 0.6, f: 1318.5 });
  // he waves, then settles for a still last frame
  tl.set(h16.pose, { handR: 'open' }, tOb + 12 / FPS);
  tl.to(h16.pose, { aR1: wave.a1, aR2: wave.a2, duration: 8 / FPS, ease: E.spring(0.7) }, tOb + 12 / FPS);
  const wv = { a: 0 };
  tl.to(wv, { a: 1, duration: 0.6, ease: E.inOutSine }, tOb + 20 / FPS);
  tl.to(h16.pose, { aR1: -10, aR2: 8, duration: 10 / FPS, ease: E.inOutCubic }, Math.min(14.45, tOb + 1.4));
  tl.set(h16.pose, { handR: 'fist' }, Math.min(14.6, tOb + 1.55));
  SC.cue(tOb + 20 / FPS, 'cloth', { gain: 0.6, pan: -0.5 });
  const faces16 = [[0, 'happy'], [tOb, 'laugh'], [tOb + 0.5, 'happy']];
  SC.on(t => {
    h16.setFace(faceAt(faces16, t)[1]);
    const extra = wv.a > 0 && wv.a < 1 ? Math.sin(wv.a * Math.PI * 4) * 18 : 0;
    const saved = h16.pose.aR2; h16.pose.aR2 = saved + extra; h16.apply(t); h16.pose.aR2 = saved;
    card.setAttribute('transform', `translate(${CARD[0]},${CARD[1] + cSt.y})`); card.style.opacity = cSt.o;
    btnIn.setAttribute('transform', `scale(${cSt.press})`);
    btnBg.setAttribute('fill', cSt.green ? P.green : P.coral);
    btnTx.setAttribute('fill', cSt.green ? P.ink : '#FFFFFF');
    btnTx.setAttribute('x', cSt.green ? 22 : 0);
    tick.style.display = cSt.green ? '' : 'none';
  });
  h16.slots.handR.style.display = 'none';
  tl.fromTo(s16.camState, { x: 520, y: 1020, s: 1.0 }, { x: 540, y: 1000, s: 1.03, duration: 15 - tSh, ease: E.outCubic }, tSh);
});
})();
</script>
</body>
</html>
