<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Stage 1 · 0–15 s</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../shared/frame.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/style.js"></script>
<script src="../shared/hero.js"></script>
<script src="../shared/subs.js"></script>
<script src="../shared/scene.js"></script>
</head>
<body>
<div id="frame"></div>
<script>
(function () {
const S = STYLE, P = S.PAL, E = S.E, el = S.el, FPS = 30;
const SC = SCENE.init({ stage: 1, duration: 15, music: { bpm: 90, key: 'Dm', drops: [] } });
const tl = SC.tl, svg = SC.svg;
const f2t = f => f / FPS;

SC.start(() => {
  const F = SC.F, W = SC.W;
  SC.music.drops.push([W('Lekin'), W('Lekin') + 2.0]);

  /* =================== SHOT 1 · close-up, bedroom at night =================== */
  const s1 = SC.shot({ name: 'S1 close-up', f0: 0, cueWord: 'Tasavvur' });
  {
    const w = s1.w;
    el('rect', { x: -100, y: -100, width: 1280, height: 2120, fill: S.linGrad(svg, [[0, S.back(P.wall, 1)], [1, P.wall]]) }, w);
    // window behind, top-left: sky + far city
    const win = el('g', {}, w);
    const wcl = S.uid('wc'); const cp = el('clipPath', { id: wcl }, S.defs(svg)); el('path', { d: S.rrect(40, 230, 430, 700, 18) }, cp);
    el('path', { d: S.rrect(22, 212, 466, 736, 26), fill: S.back('#4C3D8A', 1) }, win);
    const wi = el('g', { 'clip-path': `url(#${wcl})` }, win);
    el('rect', { x: 40, y: 230, width: 430, height: 700, fill: S.linGrad(svg, [[0, P.sky0], [1, P.sky1]]) }, wi);
    SC.city(wi, { x0: 20, x1: 500, base: 960, seed: 3, layers: [
      { col: S.back(P.sky1, 1), h: [280, 520], w: [70, 120], lit: .35, density: .5, win: 12, gap: 12 },
      { col: S.back(P.wall, 1), h: [160, 330], w: [90, 150], lit: .5, density: .55, win: 14, gap: 12 }] });
    el('rect', { x: 245, y: 230, width: 16, height: 700, fill: S.back('#4C3D8A', 1) }, win);
    el('rect', { x: 40, y: 560, width: 430, height: 16, fill: S.back('#4C3D8A', 1) }, win);
    // desk lamp practical light, right
    el('circle', { cx: 960, cy: 1160, r: 620, fill: S.radGrad(svg, S.softStops(P.win, 0.30)) }, w);
    el('path', { d: 'M880,1010L1040,1010L1110,1150L810,1150Z', fill: P.amber }, w);
    el('path', { d: 'M990,1010L1040,1010L1110,1150L1020,1150Z', fill: S.shade(P.amber) }, w);
    el('rect', { x: 948, y: 1150, width: 24, height: 300, fill: S.back(P.violet, 1) }, w);
  }
  const hero = HERO.create(svg, s1.w, { id: 'hero', seed: 101 });
  const HS = 560 / 220;                                         // face 560 px wide
  Object.assign(hero.pose, { x: 540, y: 880 + 648 * HS, s: HS });
  const heroMaskId = S.uid('erase');
  const mask = el('mask', { id: heroMaskId, maskUnits: 'userSpaceOnUse', x: -400, y: -400, width: 2000, height: 3000 }, S.defs(svg));
  el('rect', { x: -400, y: -400, width: 2000, height: 3000, fill: '#fff' }, mask);
  const erasePath = el('path', { d: '', fill: 'none', stroke: '#000', 'stroke-width': 470, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, mask);
  const heroWrap = el('g', { mask: `url(#${heroMaskId})` }, s1.w);
  heroWrap.appendChild(hero.root);

  // glint sweeps the glasses
  tl.fromTo(hero.pose, { glint: 0 }, { glint: 1, duration: 0.7, ease: E.inOutSine }, 0.35);
  tl.set(hero.pose, { glint: -1 }, 1.06);
  // at "sen": points at his chest (3-frame anticipation, then spring)
  const tS = W('sen');
  const point = hero.ik('R', 34, -446, true);
  tl.to(hero.pose, { aR1: -4, aR2: 4, duration: 3 / FPS, ease: E.inCubic }, tS - 3 / FPS);
  tl.to(hero.pose, { aR1: point.a1, aR2: point.a2, duration: 12 / FPS, ease: E.spring(0.7) }, tS);
  tl.set(hero.pose, { handR: 'point' }, tS + 2 / FPS);
  SC.cue(tS + 4 / FPS, 'cloth');
  // faces
  const faces = [[0, 'wonder'], [F('nima') / FPS, 'thinking'], [W('Dunyo'), 'worried']];
  tl.to(hero.pose, { lookY: -5, lookX: -2, duration: 6 / FPS, ease: E.outCubic }, W('Dunyo'));
  tl.to(hero.pose, { tilt: -3, duration: 0.5, ease: E.inOutSine }, W('nima'));

  // eraser: 4-frame wind-up, drop, squash, scrub
  const eraser = el('g', {}, s1.w);
  const er = el('g', {}, eraser);
  el('path', { d: S.rrect(-270, -250, 540, 250, 50), fill: P.coral }, er);
  el('path', { d: S.rrect(120, -250, 150, 250, 46), fill: S.shade(P.coral) }, er);
  el('path', { d: S.rrect(-276, -258, 552, 128, 40), fill: P.paper }, er);
  el('path', { d: S.rrect(124, -258, 152, 128, 36), fill: S.shade(P.paper) }, er);
  el('rect', { x: -276, y: -146, width: 552, height: 16, fill: S.shade(P.paper, 0.2) }, er);
  const est = { x: 560, y: -120, r: -4, sx: 1, sy: 1, show: 0 };
  const tD = W('Dunyo'), fD = F('Dunyo');
  const tLand = (fD + 4 + 7) / FPS;
  tl.set(est, { show: 1, y: 120 }, tD);
  tl.to(est, { y: 82, sy: 1.04, sx: 0.97, duration: 4 / FPS, ease: E.outCubic }, tD);                 // wind-up
  tl.to(est, { y: 790, sy: 1.06, sx: 0.96, duration: 7 / FPS, ease: E.inCubic }, tD + 4 / FPS);       // drop
  tl.to(est, { sx: 1.15, sy: 0.85, duration: 2 / FPS, ease: E.outCubic }, tLand);                     // squash
  tl.to(est, { sx: 1, sy: 1, duration: 9 / FPS, ease: E.spring(0.55) }, tLand + 2 / FPS);
  tl.to(hero.pose, { sy: 0.95, sx: 1.03, duration: 2 / FPS, ease: E.outCubic }, tLand);
  tl.to(hero.pose, { sy: 1, sx: 1, duration: 10 / FPS, ease: E.spring(0.6) }, tLand + 2 / FPS);
  SC.cue(tD, 'windup'); SC.cue(tLand, 'thud', { gain: 0.9 });
  const PTS = [[560, 790], [800, 730], [290, 830], [800, 920], [280, 1020], [800, 1120], [280, 1220], [790, 1330]];
  const tScrub0 = tLand + 4 / FPS, tScrubEnd = F('Soat') / FPS + 0.2;
  const segDur = (tScrubEnd - tScrub0) / (PTS.length - 1);
  for (let i = 0; i < PTS.length - 1; i++) SC.cue(tScrub0 + i * segDur + segDur * 0.5, 'scrub', { dur: segDur, pan: (PTS[i + 1][0] - 540) / 540 * 0.4 });
  const scrubAt = t => {
    const u = (t - tScrub0) / segDur;
    if (u <= 0) return { pts: [], cur: PTS[0], dir: 0 };
    const i = Math.min(PTS.length - 2, Math.floor(u)), fr = Math.min(1, u - i), e = E.inOutSine(fr);
    const a = PTS[i], b = PTS[i + 1];
    const cur = [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e];
    return { pts: PTS.slice(0, i + 1).concat([cur]), cur, dir: Math.sign(b[0] - a[0]) * Math.sin(Math.PI * fr) };
  };
  // crumbs
  const cr = S.rng(77), crumbs = [];
  const cg = el('g', {}, s1.w);
  for (let i = 0; i < 70; i++) {
    const ts = tScrub0 + cr() * (tScrubEnd - tScrub0 - 0.05);
    const size = cr.range(9, 20);
    const col = cr() < 0.65 ? (cr() < 0.5 ? P.coral : S.mix(P.coral, P.paper, 0.35)) : P.paper;
    const e = el('path', { d: S.rrect(-size / 2, -size * 0.4, size, size * 0.8, size * 0.35), fill: col }, cg);
    crumbs.push({ e, ts, vx: cr.range(-260, 260), vy: cr.range(-420, -60), rot: cr.range(-600, 600), ox: cr.range(-200, 200) });
    if (i % 3 === 0) SC.cue(ts, 'crumb', { gain: cr.range(0.25, 0.6), pan: cr.range(-0.4, 0.4) });
  }
  SC.on((t) => {
    hero.setFace(faces.filter(f => f[0] <= t + 1e-6).pop()[1]);
    hero.apply(t);
    eraser.style.display = est.show ? '' : 'none';
    let ex = est.x, ey = est.y, rot = est.r;
    const sc = scrubAt(t);
    if (t >= tScrub0) { ex = sc.cur[0]; ey = sc.cur[1]; rot = -4 + sc.dir * 6; }
    eraser.setAttribute('transform', `translate(${ex},${ey}) rotate(${rot}) scale(${est.sx},${est.sy})`);
    erasePath.setAttribute('d', sc.pts.length > 1 ? 'M' + sc.pts.map(p => [p[0], p[1] - 200].map(v => v.toFixed(1)).join(',')).join('L') : '');
    crumbs.forEach(c => {
      const dt = t - c.ts;
      if (dt < 0) { c.e.style.display = 'none'; return; }
      const p0 = scrubAt(c.ts).cur;
      const x = p0[0] + c.ox * 0.6 + c.vx * dt, y = p0[1] + c.vy * dt + 0.5 * 2600 * dt * dt;
      c.e.style.display = y > 2050 ? 'none' : '';
      c.e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(c.rot * dt).toFixed(1)})`);
    });
  });
  // slow 3% push-in
  tl.fromTo(s1.camState, { s: 1, y: 960 }, { s: 1.03, y: 930, duration: F('Soat') / FPS, ease: E.inOutSine }, 0);

  /* =================== SHOT 2 · wide bedroom, he is gone =================== */
  const s2 = SC.shot({ name: 'S2 wide bedroom', f0: F('Soat'), cueWord: 'Soat', cut: 'hard' });
  const t2 = W('Soat');
  const city2 = (() => {
    const w = s2.w;
    el('rect', { x: -300, y: -200, width: 1900, height: 1640, fill: S.linGrad(svg, [[0, S.back(P.wall, 1)], [1, P.wall]]) }, w);
    el('rect', { x: -300, y: 1430, width: 1900, height: 700, fill: S.linGrad(svg, [[0, S.back(P.floor, 1)], [0.5, P.floor], [1, P.floor]]) }, w);
    el('rect', { x: -300, y: 1418, width: 1900, height: 22, fill: S.shade(P.wall, 0.2) }, w);
    // big window over the city
    const WX = 480, WY = 330, WW = 720, WH = 800;
    el('path', { d: S.rrect(WX - 26, WY - 26, WW + 52, WH + 52, 26), fill: '#4C3D8A' }, w);
    const wcl = S.uid('wc2'); const cp = el('clipPath', { id: wcl }, S.defs(svg)); el('rect', { x: WX, y: WY, width: WW, height: WH }, cp);
    const wi = el('g', { 'clip-path': `url(#${wcl})` }, w);
    el('rect', { x: WX, y: WY, width: WW, height: WH, fill: S.linGrad(svg, [[0, P.sky0], [1, P.sky1]]) }, wi);
    const far = SC.city(wi, { x0: WX - 40, x1: WX + WW + 40, base: WY + 640, seed: 21, layers: [{ col: S.back(P.sky1, 1), h: [300, 520], w: [60, 110], lit: .25, density: .5, win: 11, gap: 11 }] });
    const near = SC.city(wi, { x0: WX - 30, x1: WX + WW + 40, base: WY + 690, seed: 22, layers: [{ col: S.back(P.wall, 1), h: [180, 380], w: [100, 170], lit: .3, density: .6, win: 15, gap: 13 }] });
    // street + bus
    el('rect', { x: WX, y: WY + 690, width: WW, height: 110, fill: S.back(P.floor, 2) }, wi);
    el('rect', { x: WX, y: WY + 742, width: WW, height: 6, fill: S.back(P.paper, 2) }, wi);
    const bus = el('g', {}, wi);
    el('path', { d: S.rrect(-150, -84, 300, 84, 18), fill: P.amber }, bus);
    el('path', { d: S.rrect(-150, -26, 300, 26, 10), fill: S.shade(P.amber) }, bus);
    for (let i = 0; i < 5; i++) el('rect', { x: -132 + i * 52, y: -70, width: 40, height: 30, rx: 6, fill: P.win }, bus);
    el('circle', { cx: -90, cy: 2, r: 15, fill: P.ink }, bus); el('circle', { cx: 92, cy: 2, r: 15, fill: P.ink }, bus);
    // mullions
    el('rect', { x: WX + WW / 2 - 9, y: WY, width: 18, height: WH, fill: '#4C3D8A' }, w);
    el('rect', { x: WX, y: WY + 420, width: WW, height: 18, fill: '#4C3D8A' }, w);
    el('rect', { x: WX - 40, y: WY + WH + 20, width: WW + 80, height: 26, rx: 10, fill: S.mix('#4C3D8A', P.paper, 0.15) }, w);
    // wall clock above the bed
    const ck = el('g', { transform: 'translate(190,620)' }, w);
    el('circle', { r: 112, fill: P.violet }, ck); el('circle', { r: 96, fill: P.paper }, ck);
    el('path', { d: 'M40,-88A96,96 0 0 1 40,88A110,110 0 0 0 40,-88Z', fill: S.shade(P.paper), opacity: .6 }, ck);
    for (let i = 0; i < 12; i++) el('rect', { x: -4, y: -88, width: 8, height: i % 3 ? 12 : 20, rx: 3, fill: P.ink, transform: `rotate(${i * 30})` }, ck);
    el('rect', { x: -6, y: -50, width: 12, height: 56, rx: 6, fill: P.ink, transform: 'rotate(-60)' }, ck);
    el('rect', { x: -5, y: -74, width: 10, height: 80, rx: 5, fill: P.ink, transform: 'rotate(60)' }, ck);
    const sec = el('g', {}, ck);
    el('rect', { x: -2.5, y: -84, width: 5, height: 100, rx: 2.5, fill: P.coral }, sec);
    el('circle', { r: 9, fill: P.coral }, ck);
    // bed (left)
    el('path', { d: S.rrect(-260, 1040, 560, 420, 40), fill: S.back(P.violet, 1) }, w);
    el('path', { d: S.rrect(-260, 1250, 640, 150, 30), fill: P.paper }, w);
    el('path', { d: S.rrect(-240, 1200, 240, 90, 40), fill: P.paper }, w);
    el('path', { d: S.rrect(-240, 1270, 610, 220, 44), fill: P.teal }, w);
    el('path', { d: S.rrect(200, 1270, 170, 220, 44), fill: S.shade(P.teal) }, w);
    el('rect', { x: 330, y: 1400, width: 30, height: 120, fill: S.back(P.violet, 1) }, w);
    el('ellipse', { cx: 80, cy: 1540, rx: 330, ry: 30, fill: P.ink, opacity: .25 }, w);
    // desk + lamp (right)
    el('circle', { cx: 1170, cy: 1170, r: 540, fill: S.radGrad(svg, S.softStops(P.win, 0.28)) }, w);
    el('path', { d: S.rrect(620, 1250, 640, 40, 14), fill: S.mix(P.violet, P.paper, 0.18) }, w);
    el('rect', { x: 650, y: 1290, width: 30, height: 260, fill: S.back(P.violet, 1) }, w);
    el('rect', { x: 1200, y: 1290, width: 30, height: 260, fill: S.back(P.violet, 1) }, w);
    el('ellipse', { cx: 940, cy: 1560, rx: 360, ry: 26, fill: P.ink, opacity: .25 }, w);
    el('rect', { x: 1150, y: 1120, width: 16, height: 130, fill: S.back(P.violet, 1) }, w);
    el('path', { d: 'M1090,1030L1210,1030L1260,1130L1040,1130Z', fill: P.amber }, w);
    el('path', { d: 'M1170,1030L1210,1030L1260,1130L1190,1130Z', fill: S.shade(P.amber) }, w);
    el('path', { d: S.rrect(700, 1170, 150, 80, 8), fill: P.coral }, w);       // books
    el('path', { d: S.rrect(720, 1130, 120, 40, 8), fill: P.teal }, w);
    return { far, near, bus, sec };
  })();
  const chair2 = SC.chair(s2.w, { x: 900, y: 1700, s: 0.95, col: P.coral });
  // crumbs on the floor where he sat
  { const r = S.rng(31); for (let i = 0; i < 26; i++) { const sz = r.range(8, 18), x = 760 + r.range(-90, 90) * (1 - i / 40), y = 1708 - Math.abs(r.range(-1, 1)) * 26 + r.range(-6, 4);
    el('path', { d: S.rrect(x - sz / 2, y - sz * 0.4, sz, sz * 0.8, sz * 0.35), fill: r() < .6 ? P.coral : S.mix(P.coral, P.paper, 0.4) }, s2.w); } }
  // chair still spinning to rest (ζ 0.6)
  SC.on(t => { chair2.st.a = t >= t2 ? 150 * S.damp(t - t2 + 0.25, 0.6, 0.7) : 0; });
  SC.cue(t2 + 0.05, 'creak', { dur: 1.6, pan: 0.35 });
  // clock: second hand jumps every 0.5 s (a clock may tick linearly)
  SC.on(t => {
    const u = Math.max(0, t - t2), n = Math.floor(u / 0.5), fr = (u - n * 0.5) * FPS;
    const over = fr < 4 ? [0.6, 1.18, 0.95, 1.02][Math.floor(fr)] : 1;
    city2.sec.setAttribute('transform', `rotate(${(n - 1) * 6 + 6 * over + 30})`);
  });
  for (let k = 0; t2 + k * 0.5 < F('Lekin') / FPS; k++) SC.cue(t2 + k * 0.5, 'tick', { pan: -0.45, gain: k % 2 ? 0.7 : 1 });
  // bus crosses outside, left → right in 1.2 s
  const busSt = { x: 300 };
  tl.fromTo(busSt, { x: 300 }, { x: 1380, duration: 1.2, ease: E.inOutSine }, W('avtobus'));
  SC.on(() => city2.bus.setAttribute('transform', `translate(${busSt.x},${330 + 740})`));
  SC.cue(W('avtobus') + 0.6, 'bus', { dur: 1.2 });
  // city windows light up in a wave, 2 frames apart
  const dark = city2.near.wins.concat(city2.far.wins).filter(o => !o.lit0).sort((a, b) => a.x - b.x || a.y - b.y);
  const fSh = F('shahar'), maxN = Math.floor((F('Lekin') - fSh) / 2);
  const pickN = Math.min(maxN, dark.length), step = dark.length / pickN;
  const wave = []; for (let i = 0; i < pickN; i++) wave.push(dark[Math.floor(i * step)]);
  wave.forEach((o, i) => { o.f = fSh + i * 2; if (i % 2 === 0) SC.cue(o.f / FPS, 'tinkle', { i, pan: (o.x - 840) / 600 }); });
  SC.on((t, fr) => wave.forEach(o => { const k = S.clamp((fr - o.f + 1) / 3); o.e.setAttribute('fill', k <= 0 ? o.off : S.mix(o.off, o.on, E.outCubic(k))); }));
  // slow pan toward the window
  tl.fromTo(s2.camState, { x: 560, y: 1000, s: 1.0 }, { x: 760, y: 960, s: 1.05, duration: (F('Lekin') - F('Soat')) / FPS, ease: E.inOutSine }, t2);

  /* =================== SHOT 3 · low angle on the empty chair =================== */
  const s3 = SC.shot({ name: 'S3 low angle chair', f0: F('Lekin'), cueWord: 'Lekin', cut: 'hard' });
  const t3 = W('Lekin');
  {
    const w = s3.w;
    el('rect', { x: -200, y: -200, width: 1480, height: 1900, fill: S.linGrad(svg, [[0, S.back(P.wall, 2)], [0.7, S.back(P.wall, 1)], [1, P.wall]]) }, w);
    el('rect', { x: -200, y: 1560, width: 1480, height: 600, fill: S.linGrad(svg, [[0, P.floor], [1, S.back(P.floor, 1)]]) }, w);
    el('rect', { x: -200, y: 1548, width: 1480, height: 18, fill: S.shade(P.wall, 0.2) }, w);
    // window edge glimpse, top-right
    el('path', { d: S.rrect(760, 140, 520, 760, 26), fill: '#4C3D8A' }, w);
    el('rect', { x: 786, y: 166, width: 520, height: 708, fill: S.linGrad(svg, [[0, P.sky0], [1, P.sky1]]) }, w);
    SC.city(w, { x0: 786, x1: 1300, base: 874, seed: 41, layers: [{ col: S.back(P.wall, 1), h: [200, 420], w: [80, 140], lit: .7, density: .55, win: 14, gap: 12 }] });
    // desk leg silhouette, foreground left
    el('rect', { x: -40, y: 300, width: 120, height: 1700, fill: S.back(P.violet, 2) }, w);
    el('path', { d: S.rrect(-200, 240, 420, 90, 20), fill: S.back(P.violet, 1) }, w);
  }
  el('ellipse', { cx: 560, cy: 1800, rx: 520, ry: 120, fill: S.radGrad(svg, S.softStops(P.win, 0.22)) }, s3.w);
  const chair3 = SC.chair(s3.w, { x: 560, y: 1790, s: 1.85, col: P.coral });
  { const r = S.rng(32); for (let i = 0; i < 18; i++) { const sz = r.range(14, 30); el('path', { d: S.rrect(300 + r.range(0, 120) - sz / 2, 1800 - r.range(0, 30), sz, sz * 0.8, sz * 0.35), fill: r() < .6 ? P.coral : S.mix(P.coral, P.paper, 0.4) }, s3.w); } }
  SC.on(t => { chair3.st.a = t >= t3 ? 6 * S.damp(t - t3, 0.7, 0.5) : 0; });
  // room dims to 60%, soft spotlight on the chair
  const dim3 = el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: S.radGrad(svg, [[0, P.ink, 0.0], [0.3, P.ink, 0.10], [0.6, P.ink, 0.45], [1, P.ink, 0.62]], { cx: 0.52, cy: 0.60, r: 0.62 }) }, s3.g);
  s3.g.insertBefore(dim3, null);
  const dimSt = { o: 0 };
  tl.fromTo(dimSt, { o: 0 }, { o: 1, duration: 0.6, ease: E.outCubic }, t3);
  SC.on(() => dim3.setAttribute('opacity', dimSt.o));
  // big "?" line-draws at "kim" in 18 frames
  const q = SC.question(s3.scr, { x: 540, y: 700, s: 1.1, col: P.paper });
  tl.fromTo(q.st, { d: 0 }, { d: 1, duration: 18 / FPS, ease: E.inOutCubic }, W('kim'));
  tl.fromTo(q.st, { dot: 0 }, { dot: 1, duration: 9 / FPS, ease: t => E.outBack(t, 2.2) }, W('kim') + 15 / FPS);
  SC.cue(W('kim'), 'draw', { dur: 18 / FPS }); SC.cue(W('kim') + 17 / FPS, 'pop', { gain: 0.6 });
  tl.fromTo(s3.camState, { x: 540, y: 980, s: 1.0, r: -1.2 }, { x: 545, y: 940, s: 1.045, r: 0.6, duration: (F('Sen') - F('Lekin')) / FPS, ease: E.inOutSine }, t3);

  /* =================== SHOT 4 · match-cut: macro on the crumb pile =================== */
  const s4 = SC.shot({ name: 'S4 macro crumbs', f0: F('Sen'), cueWord: 'Sen', cut: 'match' });
  const t4 = W('Sen');
  const ORB = [540, 700 + 122 * 1.1];                            // same screen spot as the "?" dot
  {
    const w = s4.w;
    el('rect', { x: -200, y: -200, width: 1480, height: 1300, fill: S.linGrad(svg, [[0, S.back(P.wall, 3)], [1, S.back(P.wall, 2)]]) }, w);
    el('rect', { x: -200, y: 1000, width: 1480, height: 1200, fill: S.linGrad(svg, [[0, S.back(P.floor, 2)], [0.35, S.back(P.floor, 1)], [1, P.floor]]) }, w);
    // giant chair wheel silhouettes, out of focus by value only
    el('circle', { cx: 120, cy: 930, r: 120, fill: S.back(P.ink, 0) }, w);
    el('circle', { cx: 980, cy: 900, r: 100, fill: S.back(P.ink, 0) }, w);
    el('rect', { x: 100, y: 760, width: 900, height: 70, rx: 35, fill: S.back(P.violet, 3) }, w);
    el('ellipse', { cx: 540, cy: 1230, rx: 520, ry: 90, fill: P.ink, opacity: .25 }, w);
  }
  const pileBack = el('g', {}, s4.w), orbG = el('g', {}, s4.w), pileFront = el('g', {}, s4.w);
  {
    const r = S.rng(55);
    const pel = (g, x, y, sz, rot) => {
      const col = r() < 0.62 ? P.coral : S.mix(P.coral, P.paper, 0.45);
      const pg = el('g', { transform: `translate(${x},${y}) rotate(${rot})` }, g);
      el('path', { d: S.rrect(-sz / 2, -sz * 0.4, sz, sz * 0.8, sz * 0.36), fill: col }, pg);
      el('path', { d: S.rrect(sz * 0.12, -sz * 0.4, sz * 0.38, sz * 0.8, sz * 0.3), fill: S.shade(col) }, pg);
    };
    for (let i = 0; i < 90; i++) { const a = r(); const x = 540 + r.range(-470, 470) * (0.35 + 0.65 * a); const y = 1210 - Math.pow(1 - Math.abs(x - 540) / 480, 1.3) * r.range(80, 470); pel(pileBack, x, y, r.range(50, 110), r.range(-40, 40)); }
    for (let i = 0; i < 40; i++) { const x = 540 + r.range(-500, 500); if (Math.abs(x - ORB[0]) < 95) continue; const y = 1250 - Math.pow(1 - Math.abs(x - 540) / 520, 1.2) * r.range(120, 380); pel(pileFront, x, y, r.range(70, 130), r.range(-30, 30)); }
    [[-70, 70, 26], [62, 64, -22], [-8, 118, 8], [-120, 10, 30], [118, 0, -30]].forEach(([dx, dy, rot]) => pel(pileFront, ORB[0] + dx, ORB[1] + dy, 92, rot));
  }
  const orb = SC.innerLight(orbG, { x: ORB[0], y: ORB[1] });
  orb.st.s = 1.6;
  const fYq = F('yoʻqsan');
  // flickers twice, goes out at "yoʻqsan"
  tl.set(orb.st, { k: 1 }, t4);
  [[t4 + 0.45, 0.18, 3], [t4 + 1.2, 0.1, 4]].forEach(([t, k, n]) => {
    tl.to(orb.st, { k, duration: 1 / FPS, ease: E.inCubic }, t);
    tl.to(orb.st, { k: 0.75, duration: 1 / FPS, ease: E.outCubic }, t + (n - 1) / FPS);
    tl.to(orb.st, { k: 1, duration: 4 / FPS, ease: E.outCubic }, t + n / FPS);
    SC.cue(t, 'flicker', { dur: n / FPS });
  });
  tl.to(orb.st, { k: 0, s: 0.2, duration: 8 / FPS, ease: E.inExpo }, fYq / FPS);
  SC.cue(fYq / FPS + 6 / FPS, 'fizz', { dur: 0.7 });
  tl.fromTo(SC.fade, { v: 0 }, { v: 0.92, duration: 0.75, ease: E.inCubic }, fYq / FPS + 0.12);
  tl.fromTo(s4.camState, { x: 540, y: 960, s: 1.0 }, { x: 556, y: 975, s: 1.05, duration: 15 - t4, ease: E.inOutSine }, t4);
});
})();
