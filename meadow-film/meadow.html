<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Light</title>
<style>
  :root { --bg:#0b0b10; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  canvas { position:absolute; inset:0; margin:auto; display:block;
           width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

/* =====================================================================
   MEADOW LIGHT — 10 s, 1920x1080, 60 fps, 72 BPM
   renderAt(t) draws exact time t.  ?t=4.2 freezes.  ?scale=0.5 preview.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const SCALE = parseFloat(Q.get('scale') || '1');
const W = Math.round(1920 * SCALE), H = Math.round(1080 * SCALE);
const FPS = 60, DUR = 10;
const DEG = Math.PI / 180;
const TL = { gust: 5/3, crest: 10/3, birds: 5.0, shafts: 20/3, reappear: 25/3, hold: 10, bpm: 72 };

// ---------- seeded helpers
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(ix,iy){ let h=(Math.imul(ix|0,374761393)+Math.imul(iy|0,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function vnoise(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy; const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1); return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy; }
function fbm(x,y,o=4){ let s=0,a=0.5,f=1,n=0; for(let i=0;i<o;i++){ s+=a*vnoise(x*f+i*17.3,y*f-i*9.1); n+=a; f*=2.03; a*=0.5; } return s/n; }
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const smoother=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*t*(t*(t*6-15)+10); };
const lerp=(a,b,t)=>a+(b-a)*t;
const v3=h=>new THREE.Vector3(((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255);

const PAL = { zen:0x4A73C9, mid:0xF4A3A8, hor:0xFFC673, sun:0xFFF3C4,
  cLit:0xFFE1B0, cBody:0xF7B6A3, cShad:0x9C86C9, cRim:0xFFF6DC,
  g0:0x2E7A4F, g1:0x5BAA4A, g2:0xD7E36A, gP:0x8CC85A,
  fW:0xF7F4EC, fY:0xFFD24A, fB:0x6FA8FF, fP:0xF29BB8,
  fol:0x3F8E4E, folLit:0x9ED56A, trunk:0x6B4A35, rock:0x9AA0A8, moss:0x6FAF52,
  wall:0xE6D9C2, roof:0xB5523B, sail:0xC9A57A, mNear:0x5E8A8C, mFar:0x7B8FC8, key:0xFFD9A0 };

// =====================================================================
// TERRAIN
// =====================================================================
const WATER_Y = -46;
function terrainH(x,z){
  const d = -z, crest = 4.2, xc = d - crest;
  // gentle upslope to the crest, then a concave valley side (visible from the crest)
  let h = xc < 0 ? -0.03*xc*xc : -50*(1 - Math.exp(-xc/110))*(xc/(xc + 6));
  h -= 0.0035*x*x*(1 - sstep(10,140,d));                                   // rounded meadow ridge
  const ax = Math.abs(x + 20) + (fbm(x*0.004, z*0.004, 3) - 0.5)*160;
  h += 75*sstep(170,700,ax)*sstep(60,360,d);                                // valley walls
  h += 78*sstep(690,1050,d + (fbm(x*0.003, 5.0, 3)-0.5)*160);              // far shore
  h += 49*Math.exp(-((x+95)**2 + (z+455)**2)/(2*58*58));                    // windmill hill
  h += 16*Math.exp(-((x-190)**2 + (z+430)**2)/(2*45*45));
  h += 8*Math.exp(-((x+150)**2 + (z+300)**2)/(2*35*35));
  h -= 14*sstep(230, 330, d)*(1 - sstep(640, 760, d))*(1 - sstep(150, 260, Math.abs(x + 10)));   // lake basin
  const amp = lerp(0.15, 3.0, sstep(8, 160, d))*(1 - 0.6*sstep(260, 340, d));
  h += (fbm(x*0.06, z*0.06, 3) - 0.5)*amp;
  return h;
}
const CREST_Y = terrainH(0,-4.2);

// =====================================================================
// CAMERA PATH (precomputed, damped 0.95 per 60 fps frame, no linear moves)
// =====================================================================
const CAM = (() => {
  const hz = 600, t0 = -2, t1 = 10.8, n = Math.round((t1-t0)*hz)+1, dt = 1/hz;
  const a = 1 - Math.pow(0.95, 60/hz);
  const vT = t => 1.2 + 0.45*smoother(3.8,6.0,t) - 1.12*smoother(7.9,9.7,t);
  const yawT = t => -10*DEG*smoother(3.4,9.3,t);
  const pitchT = t => DEG*(4.0 - 6.8*smoother(2.1,4.3,t) + 1.0*smoother(6,10,t));
  const kT = t => smoother(1.9,3.8,t);
  const fovT = t => 1 + 0.03*smoother(8.3,10.0,t);
  const o = { t0, hz, n, x:new Float64Array(n), z:new Float64Array(n), yaw:new Float64Array(n),
              pitch:new Float64Array(n), k:new Float64Array(n), fk:new Float64Array(n) };
  let v=vT(t0), yaw=yawT(t0), pitch=pitchT(t0), k=kT(t0), fk=fovT(t0), x=0, z=0;
  for (let i=0;i<n;i++){
    const t = t0 + i*dt;
    v += (vT(t)-v)*a; yaw += (yawT(t)-yaw)*a; pitch += (pitchT(t)-pitch)*a; k += (kT(t)-k)*a; fk += (fovT(t)-fk)*a;
    o.x[i]=x; o.z[i]=z; o.yaw[i]=yaw; o.pitch[i]=pitch; o.k[i]=k; o.fk[i]=fk;
    x += -Math.sin(yaw)*v*dt; z += -Math.cos(yaw)*v*dt;
  }
  const i0 = Math.round((0-t0)*hz), dz = 0.4 - o.z[i0], dx = -o.x[i0];
  for (let i=0;i<n;i++){ o.z[i]+=dz; o.x[i]+=dx; }
  return o;
})();
function camAt(t){
  const f = clamp((t - CAM.t0)*CAM.hz, 0, CAM.n-1.001), i = Math.floor(f), u = f - i;
  const g = k => lerp(CAM[k][i], CAM[k][i+1], u);
  const x = g('x'), z = g('z'), k = g('k');
  const gy = terrainH(x,z);
  let y = lerp(gy + 0.25, CREST_Y + 6.0 + 0.4*sstep(5,10,t), k);
  y = Math.max(y, gy + 0.22);
  return { x, y, z, yaw:g('yaw'), pitch:g('pitch'), fk:g('fk') };
}

// =====================================================================
// SUN PATH (sinks smoothly all film, fastest through the cloud beat)
// =====================================================================
const SUNT = (() => {
  const hz=600, t0=-1, t1=11, n=Math.round((t1-t0)*hz)+1; const el=new Float64Array(n); let e=15.5;
  // integrate from t=0 so that el(0)=15.5
  const vel = t => 0.5 + 2.3*Math.exp(-0.5*((t-7.5)/1.0)**2);
  const i0 = Math.round(-t0*hz); el[i0]=e;
  for (let i=i0+1;i<n;i++){ const t=t0+i/hz; e -= vel(t-0.5/hz)/hz; el[i]=e; }
  e = el[i0]; for (let i=i0-1;i>=0;i--){ const t=t0+i/hz; e += vel(t+0.5/hz)/hz; el[i]=e; }
  return { t0, hz, n, el };
})();
function sunAE(t){ const f=clamp((t-SUNT.t0)*SUNT.hz,0,SUNT.n-1.001), i=Math.floor(f), u=f-i;
  return { az: 8.0 - 0.12*t, el: lerp(SUNT.el[i], SUNT.el[i+1], u) }; }
function dirFromAE(az,el){ const a=az*DEG, e=el*DEG; return new THREE.Vector3(Math.sin(a)*Math.cos(e), Math.sin(e), -Math.cos(a)*Math.cos(e)); }

// =====================================================================
// CLOUDS (7 huge cumulus, defined in sky angles; shared by shader + JS)
// =====================================================================
const VFOV = 38, HFOV = 2*Math.atan(Math.tan(VFOV/2*DEG)*16/9)/DEG;
const SUN_R_DEG = Math.atan(0.05*Math.tan(HFOV/2*DEG))/DEG;   // radius = 2.5% of frame width
const DRIFT = 0.003*HFOV;                                       // deg/s  (0.3% frame width / s)
const NC = 7, NB = 14;
const CLOUDS = (() => {
  const r = mulberry32(777);
  const cum = (W_, Hh, n, ox=0, oy=0) => {
    const bl=[]; const nb=Math.max(3,Math.round(n*0.36));
    for (let i=0;i<nb;i++){ const u=-W_/2+W_*(i+0.5)/nb+(r()-0.5)*W_/nb*0.35; const rad=W_/nb*0.62*(0.85+0.3*r());
      bl.push([u+ox, rad*0.55+oy, rad]); }
    for (let i=nb;i<n;i++){ const k=(i-nb+0.5)/(n-nb); const hw=W_*0.5*(1-0.62*Math.pow(k,1.1));
      const rad=lerp(W_*0.17, Hh*0.24, k)*(0.85+0.3*r()); const v=Hh*(0.12+0.70*k) + (r()-0.5)*Hh*0.08;
      const u=(r()*2-1)*hw*0.62; bl.push([u+ox, Math.min(v, Hh-rad)+oy, rad]); }
    return bl;
  };
  const list = [];
  // C0: the sun-occluding cumulus. Its ragged lower shelf crosses the sun path between 6.67 and 8.33.
  const s667 = sunAE(TL.shafts), s833 = sunAE(TL.reappear), s75 = sunAE(7.5);
  const bandTop = s667.el - 0.1*SUN_R_DEG, bandBot = s833.el - 0.1*SUN_R_DEG;
  const half = (bandTop - bandBot)/2;
  const c0 = { az: s75.az - DRIFT*7.5, el: bandBot, blobs: [] };
  const shelf = [[-11.2,0.42,0.45],[-9.4,0.66,0.22],[-7.0,0.86,0.10],[-4.6,0.96,-0.04],[-2.4,1.16,0.10],[-0.3,1.04,-0.02],[1.6,1.18,0.12],[3.6,0.98,0.02],[5.6,1.25,0.35]];
  for (const [u,k,vo] of shelf) c0.blobs.push([u, half*(0.98+vo), half*k]);
  for (const b of cum(15, 13.5, 5, 14.5, half*0.4)) c0.blobs.push(b);
  list.push(c0);
  list.push({ az:-28, el:6.0,  blobs: cum(26, 15, 14) });
  list.push({ az: 39, el:7.5,  blobs: cum(24, 14, 13) });
  list.push({ az: -4, el:22.0, blobs: cum(26, 10, 12) });
  list.push({ az:-56, el:2.5,  blobs: cum(20, 9, 10) });
  list.push({ az: 63, el:3.0,  blobs: cum(20, 11, 11) });
  list.push({ az: 21, el:27.0, blobs: cum(20, 9, 10) });
  for (const c of list){
    let vmin=1e9, vmax=-1e9;
    for (const b of c.blobs){ vmin=Math.min(vmin,b[1]-b[2]); vmax=Math.max(vmax,b[1]+b[2]); }
    c.cv = Math.max(0,(vmin+vmax)/2); let br=0;
    for (const b of c.blobs) br=Math.max(br, Math.hypot(b[0], b[1]-c.cv)+b[2]);
    c.br = br + 1.6; c.hh = Math.max(1, vmax/2);
    if (c.blobs.length > NB) c.blobs.length = NB;
  }
  return { list, bandTop, bandBot };
})();
function smin(a,b,k){ const h=Math.max(k-Math.abs(a-b),0)/k; return Math.min(a,b)-h*h*k*0.25; }
function cloudAlphaJS(az, el, t){
  let A = 0;
  for (const c of CLOUDS.list){
    const px = az - c.az - DRIFT*t, py = el - c.el;
    if (Math.hypot(px, py-c.cv) > c.br) continue;
    let s = 1e3; for (const b of c.blobs) s = smin(s, Math.hypot(px-b[0], py-b[1]) - b[2], 0.9);
    s = Math.max(s, -py);
    const a = 1 - sstep(-0.30, 0.10, s);
    A = 1 - (1-A)*(1-a);
  }
  return A;
}
function sunVisAt(t){
  const s = sunAE(t); let acc=0, n=0;
  for (let i=0;i<7;i++) for (let j=0;j<7;j++){ const u=(i/6)*2-1, v=(j/6)*2-1; if (u*u+v*v>1) continue;
    acc += 1 - cloudAlphaJS(s.az + u*SUN_R_DEG, s.el + v*SUN_R_DEG, t); n++; }
  return acc/n;
}

// =====================================================================
// RENDERER / SHARED UNIFORMS
// =====================================================================
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, preserveDrawingBuffer:true, powerPreference:'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 0);

const U = {
  uTime:{value:0}, uSunDir:{value:new THREE.Vector3(0,0.2,-1)}, uSunCol:{value:v3(PAL.key)}, uSunVis:{value:1},
  uCamPos:{value:new THREE.Vector3()}, uAmbTop:{value:new THREE.Vector3(0.74,0.71,0.92)}, uAmbBot:{value:new THREE.Vector3(0.66,0.72,0.62)},
  uClipY:{value:-1e9}, uWindDir:{value:new THREE.Vector2(0.62,-0.78).normalize()}, uGustX0:{value:0}, uHazeK:{value:0.00075},
  uSkyZ:{value:v3(PAL.zen)}, uSkyM:{value:v3(PAL.mid)}, uSkyH:{value:v3(PAL.hor)}, uRim:{value:v3(PAL.cRim)},
  uFade:{value:new THREE.Vector2(24,42)},
};
const COMMON = /* glsl */`
uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSunVis; uniform vec3 uCamPos;
uniform vec3 uAmbTop; uniform vec3 uAmbBot; uniform float uClipY; uniform vec2 uWindDir; uniform float uGustX0; uniform float uHazeK;
uniform vec3 uSkyZ; uniform vec3 uSkyM; uniform vec3 uSkyH; uniform vec3 uRim; uniform vec2 uFade;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm3(vec2 p){ return (0.5*vnoise(p)+0.25*vnoise(p*2.03+17.1)+0.125*vnoise(p*4.01+31.7))/0.875; }
float toon(float x, float th){ return smoothstep(th-0.04, th+0.04, x); }   // 2-band ramp, edge softness 0.08
vec3 skyBase(vec3 d){
  float el = degrees(asin(clamp(d.y,-1.,1.)));
  float a = smoothstep(-1.0, 11.0, el);
  float b = smoothstep(5.0, 32.0, el);
  vec3 c = mix(uSkyH, uSkyM, a);
  c = mix(c, uSkyZ, b);
  float ang = acos(clamp(dot(d,uSunDir),-1.,1.));
  float vis = mix(0.55, 1.0, uSunVis);
  c += vec3(1.0,0.86,0.62)*(0.26*exp(-ang/0.07) + 0.14*exp(-ang/0.30))*vis;
  vec2 hd = normalize(d.xz+1e-5), hs = normalize(uSunDir.xz+1e-5);
  c += vec3(0.10,0.05,0.0)*pow(max(dot(hd,hs),0.0),6.0)*(1.0-a);
  return c;
}
vec3 hazeCol(vec3 v){ vec3 d = normalize(vec3(v.x, max(v.y,0.0)*0.3 + 0.012, v.z)); vec3 c = skyBase(d);
  float ang = acos(clamp(dot(d,uSunDir),-1.,1.)); return c - vec3(1.0,0.86,0.62)*0.18*exp(-ang/0.07); }
vec3 applyHaze(vec3 c, vec3 wp, float k){
  vec3 dv = wp - uCamPos; float dist = length(dv);
  float f = 1.0 - exp(-pow(dist*uHazeK*k, 1.15));
  return mix(c, hazeCol(dv/max(dist,1e-3)), f);
}
float gustAt(vec2 xz, float t){
  float x = dot(xz, uWindDir);
  float g = exp(-pow((x - (uGustX0 + 4.6*(t-1.667)))/1.9, 2.0)) * smoothstep(0.2, 0.9, t);
  g += 0.45*exp(-pow((x - (uGustX0 - 7.0 + 5.0*(t-5.6)))/3.6, 2.0));
  g += 0.40*exp(-pow((x - (uGustX0 - 10.0 + 5.0*(t-9.2)))/4.2, 2.0));
  return g;
}
float swayAt(vec2 xz, float t, float r){
  return 0.5*sin(t*1.25 + dot(xz, vec2(0.21,0.13)) + r*6.283)
       + 0.32*sin(t*2.05 + dot(xz, uWindDir)*0.8 + r*2.0)
       + 0.18*sin(t*3.55 + xz.x*1.3 - xz.y*0.9 + r*11.0);
}
`;
const withU = (extra={}) => Object.assign({}, U, extra);

// =====================================================================
// SKY + CLOUDS (fullscreen, drawn last behind everything)
// =====================================================================
const SKY_FS = /* glsl */`
${COMMON}
#define NC ${NC}
#define NB ${NB}
uniform vec4 uCl[NC]; uniform vec4 uBl[NC*NB]; uniform vec2 uClH[NC];
uniform float uDrift; uniform vec2 uSunAE; uniform mat4 uProjInv; uniform mat4 uCamWorld; uniform vec2 uRes;
uniform float uScreenSun; uniform vec2 uSunPx; uniform float uSunRpx; uniform float uSunRad; uniform float uSunFront;
uniform vec3 uCLit; uniform vec3 uCBody; uniform vec3 uCShad; uniform vec3 uSunDisc;
float sminf(float a, float b, float k){ float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*0.25; }
void main(){
  vec2 ndc = gl_FragCoord.xy/uRes*2.0-1.0;
  vec4 vv = uProjInv*vec4(ndc,1.0,1.0); vv/=vv.w;
  vec3 d = normalize(mat3(uCamWorld)*vv.xyz);
  vec3 col = skyBase(d);
  float disc;
  if (uScreenSun > 0.5) { float dp = length(gl_FragCoord.xy-uSunPx); disc = (1.0-smoothstep(uSunRpx-1.1, uSunRpx+1.1, dp))*uSunFront; }
  else { float ang = acos(clamp(dot(d,uSunDir),-1.,1.)); disc = 1.0-smoothstep(uSunRad*0.97, uSunRad*1.03, ang); }
  col = mix(col, uSunDisc*1.08, disc);

  float az = degrees(atan(d.x, -d.z)), el = degrees(asin(clamp(d.y,-1.,1.)));
  vec3 cc = vec3(0); float ca = 0.0, cb = 0.0;
  for (int i=0;i<NC;i++){
    vec4 C = uCl[i];
    vec2 p = vec2(az - C.x - uDrift, el - C.y);
    if (length(p - vec2(0.0, C.w)) > C.z) continue;
    float sdf = 1e3; vec3 ns = vec3(0.0); float ws = 0.0;
    for (int j=0;j<NB;j++){
      vec4 B = uBl[i*NB+j];
      if (B.z <= 0.0) break;
      vec2 q = p - B.xy; float dd = length(q);
      sdf = sminf(sdf, dd - B.z, 0.9);
      float hh = sqrt(max(B.z*B.z - dd*dd, 0.0));
      float w = hh*hh*hh + 1e-4;
      ns += normalize(vec3(q, hh + 1e-3))*w; ws += w;
    }
    sdf = max(sdf, -p.y);
    float nz = fbm3(p*0.55 + float(i)*7.31 + vec2(uTime*0.02, 0.0));
    sdf += (nz - 0.5)*0.9;
    float a = 1.0 - smoothstep(-0.30, 0.10, sdf);
    if (a <= 0.001) continue;
    vec3 n = normalize(ns/max(ws,1e-4));
    vec2 sp = vec2(uSunAE.x - C.x - uDrift, uSunAE.y - C.y);
    vec2 l2 = normalize(sp - p + 1e-4);
    float sunD0 = length(sp - p);
    vec3 L = normalize(vec3(l2, mix(-0.30, 0.55, smoothstep(4.0, 40.0, sunD0))));
    float ndl = dot(n, L) + (fbm3(p*1.3 + 3.0) - 0.5)*0.40;
    float lit = toon(ndl, 0.22);
    vec3 c = mix(uCBody, uCLit, lit);
    float hrel = clamp(p.y/(uClH[i].x*2.0), 0.0, 1.0);
    float sh = toon(-ndl*0.80 - n.y*0.45 + (1.0-hrel)*0.20 + (nz-0.5)*0.35, 0.56);
    c = mix(c, uCShad, sh*(1.0 - lit)*(1.0 - exp(-sunD0/4.0)));
    float sunD = length(sp - p);
    float sunNear = exp(-sunD/5.0);
    float edge = smoothstep(-0.60, -0.04, sdf);
    float rimDir = 0.30 + 0.70*max(dot(normalize(n.xy + 1e-4), l2), 0.0);
    float rim = edge*rimDir*(0.55 + 2.4*sunNear)*mix(0.7, 1.0, uSunVis);
    c = mix(c, uRim, clamp(rim, 0.0, 1.0));
    float trans = exp(-sunD/3.6)*(1.0 - 0.45*a);
    c = mix(c, uCLit*1.25, clamp(trans, 0.0, 1.0)*0.75);
    c = mix(c, hazeCol(d), (1.0 - smoothstep(0.0, 12.0, el))*0.28);
    cc = c*a + cc*(1.0 - a);
    cb = max(cb*(1.0 - a), clamp(rim,0.0,1.6)*a*0.55 + trans*a*0.35);
    ca = a + ca*(1.0 - a);
  }
  col = col*(1.0 - ca) + cc;

      attribute float aV;
      void main(){
        vec4 wp = modelMatrix*vec4(position,1.0);
        vLP = position;

          float s = swayAt(wp.xz*0.15, uTime, 0.0);

          float k = uSway*aSway;

// ---------- geometry helpers
function mergeGeos(list){ // non-indexed merge of position/normal (+ optional aSway)
  let n = 0; const gs = list.map(g => { const ng = g.index ? g.toNonIndexed() : g; n += ng.attributes.position.count; return ng; });
  const P = new Float32Array(n*3), N = new Float32Array(n*3), S = new Float32Array(n); let o = 0;
  for (const g of gs){ const c = g.attributes.position.count; P.set(g.attributes.position.array, o*3); N.set(g.attributes.normal.array, o*3);
    if (g.attributes.aSway) S.set(g.attributes.aSway.array, o); o += c; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(P,3)); g.setAttribute('normal', new THREE.BufferAttribute(N,3));
  g.setAttribute('aSway', new THREE.BufferAttribute(S,1)); return g;
}
function lumpy(radius, detail, seed, amp, sx=1, sy=1, sz=1){
  const g = new THREE.IcosahedronGeometry(radius, detail); const p = g.attributes.position;
  for (let i=0;i<p.count;i++){ const v = new THREE.Vector3().fromBufferAttribute(p,i); const n = v.clone().normalize();
    const k = 1 + (fbm(n.x*2.2+seed, n.y*2.2+n.z*1.7-seed, 3)-0.5)*amp; v.copy(n.multiplyScalar(radius*k)); v.x*=sx; v.y*=sy; v.z*=sz; p.setXYZ(i,v.x,v.y,v.z); }
  return smoothNormals(g);
}
function smoothNormals(g){
  g.computeVertexNormals(); const p = g.attributes.position, n = g.attributes.normal, acc = new Map();
  const key = i => `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
  for (let i=0;i<p.count;i++){ const k = key(i); const a = acc.get(k) || [0,0,0]; a[0]+=n.getX(i); a[1]+=n.getY(i); a[2]+=n.getZ(i); acc.set(k,a); }
  for (let i=0;i<p.count;i++){ const a = acc.get(key(i)); const l = Math.hypot(a[0],a[1],a[2])||1; n.setXYZ(i, a[0]/l, a[1]/l, a[2]/l); }
  return g;
}

function updateBirds(t){

    for (let i=0;i<d.length;i++){ const t=i/SR; lp += ((rng()*2-1) - lp)*0.35; d[i] = lp*Math.exp(-t*2.1)*(t<0.012?t/0.012:1); } }
  const rev = ctx.createConvolver(); rev.buffer = ir; const revOut = ctx.createGain(); revOut.gain.value = 0.55; rev.connect(revOut); revOut.connect(master);
  const fadeOut = (g, level) => { g.gain.setValueAtTime(level, DUR-0.8); g.gain.linearRampToValueAtTime(0.0001, DUR); };
  const ambBus = ctx.createGain(); ambBus.gain.value = 1; ambBus.connect(master); fadeOut(ambBus, 1);
  const musBus = ctx.createGain(); musBus.gain.value = 1; musBus.connect(master); fadeOut(musBus, 1);
  const musSend = ctx.createGain(); musSend.gain.value = 0.55; musBus.connect(musSend); musSend.connect(rev);
  // pink noise (Kellet)
  const pink = (secs) => { const b = ctx.createBuffer(2, Math.round(SR*secs), SR);
    for (let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i=0;i<d.length;i++){ const w=rng()*2-1; b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
        b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; } }
    return b; };
  const noiseBuf = pink(DUR);
  const curve = (fn, n=400) => { const a = new Float32Array(n); for (let i=0;i<n;i++) a[i] = fn(i/(n-1)*DUR); return a; };
  const curveSeg = (fn, t0, t1, n=200) => { const a = new Float32Array(n); for (let i=0;i<n;i++) a[i] = fn(lerp(t0,t1,i/(n-1))); return a; };
  const gauss = (t, c, wl, wr) => Math.exp(-0.5*((t-c)/(t<c?wl:wr))**2);
  // breeze bed: pink noise, band-pass 300–2500 Hz, slow swells
  { const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300; hp.Q.value=0.6;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.5;
    lp.frequency.setValueCurveAtTime(curve(t=>1500+700*Math.sin(t*0.9)+300*Math.sin(t*2.1+1)), 0, DUR);
    const g = ctx.createGain(); g.gain.setValueCurveAtTime(curve(t=>0.55*(0.72+0.18*Math.sin(t*2*Math.PI/6.5-1)+0.10*Math.sin(t*2*Math.PI/2.9+2))*Math.min(1,t/0.6+0.15)), 0, DUR);
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ambBus); src.start(0); }
  // gust swell peaking at 1.67 (sweeps left → right with the wind)
  { const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.97;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
    bp.frequency.setValueCurveAtTime(curve(t=>500+1300*gauss(t,TL.gust,0.8,1.1)), 0, DUR);
    const g = ctx.createGain(); g.gain.setValueCurveAtTime(curve(t=>1.25*gauss(t,TL.gust,0.75,1.0)), 0, DUR);
    const pan = ctx.createStereoPanner(); pan.pan.setValueCurveAtTime(curve(t=>clamp((t-TL.gust)*0.45,-0.7,0.7)), 0, DUR);
    src.connect(bp); bp.connect(g); g.connect(pan); pan.connect(ambBus); src.start(0, 2.3); }
  // airy swell under the light shafts (6.67)
  { const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 1.03;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2800;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000;
    const g = ctx.createGain(); g.gain.setValueCurveAtTime(curve(t=>0.55*gauss(t,7.35,0.6,0.9)), 0, DUR);
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ambBus); g.connect(rev); src.start(0, 4.1);
    for (const [f,pn] of [[1174.66,-0.3],[1760,0.3],[2349.3,0]]){ const o = ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const og = ctx.createGain(); og.gain.setValueCurveAtTime(curve(t=>0.010*gauss(t,7.4,0.55,0.9)), 0, DUR);
      const p = ctx.createStereoPanner(); p.pan.value = pn; o.connect(og); og.connect(p); p.connect(musBus); o.start(0); } }
  // leaf rustle at the crest
  for (let i=0;i<70;i++){
    const t = TL.crest - 0.5 + Math.pow(rng(),1.2)*1.6, dur = 0.02 + rng()*0.05;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 2500+rng()*4000; bp.Q.value = 1.2;
    const g = ctx.createGain(); const amp = 0.20*gauss(t, TL.crest+0.15, 0.4, 0.6)*(0.4+rng()*0.6);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t+0.004); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    const p = ctx.createStereoPanner(); p.pan.value = rng()*1.6-0.8;
    src.connect(bp); bp.connect(g); g.connect(p); p.connect(ambBus); src.start(t, rng()*8, dur+0.02);
  }
  // two distant bird chirps at 5.0
  for (const [t0, base, pn] of [[TL.birds, 3400, 0.25], [TL.birds+0.38, 3900, 0.35]]){
    for (let s=0;s<3;s++){
      const t = t0 + s*0.085, d = 0.06;
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueCurveAtTime(new Float32Array([base, base*1.35, base*1.1, base*1.25].map(f=>f*(1+0.04*s))), t, d);
      const g = ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045*(1-s*0.2), t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 5200;
      const p = ctx.createStereoPanner(); p.pan.value = pn;
      o.connect(g); g.connect(lp); lp.connect(p); p.connect(ambBus); p.connect(rev); o.start(t); o.stop(t+d+0.02);
    }
  }
  // faint windmill creak (one per sail pass after the valley opens)
  for (let k=0;k<4;k++){
    const t = 3.9 + k/(0.15*4);
    if (t > DUR-0.6) break;
    const o = ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueCurveAtTime(new Float32Array(Array.from({length:24},(_,i)=>78+22*Math.sin(i*0.9)+rng()*12)), t, 0.42);
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 720; bp.Q.value = 3.5;
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.030, t+0.08); g.gain.linearRampToValueAtTime(0.0, t+0.42);
    const p = ctx.createStereoPanner(); p.pan.value = -0.45;
    o.connect(bp); bp.connect(g); g.connect(p); p.connect(ambBus); p.connect(rev); o.start(t); o.stop(t+0.45);
  }
  // music: D major, 72 BPM
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  // warm string pad
  const CHORDS = [ [0, 4*beat, [50,57,64,66]], [4*beat, 6*beat, [47,54,57,62]], [6*beat, 8*beat, [43,50,54,59]],
                   [8*beat, 9*beat, [40,52,55,59,66]], [9*beat, 9.5*beat, [45,52,55,62]], [9.5*beat, 10*beat, [45,52,55,61]], [10*beat, 13*beat, [38,50,57,61,64,66]] ];
  for (const [t0,t1,notes] of CHORDS){
    const att = t0 === 0 ? 1.8 : 0.45, rel = 0.6;
    for (const n of notes){
      for (const det of [-7, 6]){
        const o = ctx.createOscillator(); o.type='sawtooth'; o.frequency.value = mtof(n); o.detune.value = det + (rng()-0.5)*3;
        const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 650 + (n-40)*14; lp.Q.value = 0.4;
        const g = ctx.createGain(); const lvl = 0.016*(n<48?1.1:0.85);
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(lvl, t0+att);
        g.gain.setValueAtTime(lvl, Math.max(t0+att, t1)); g.gain.linearRampToValueAtTime(0, Math.max(t0+att, t1)+rel);
        const p = ctx.createStereoPanner(); p.pan.value = det < 0 ? -0.35 : 0.35;
        o.connect(lp); lp.connect(g); g.connect(p); p.connect(musBus); o.start(t0); o.stop(Math.min(DUR, Math.max(t0+att,t1)+rel+0.05));
      }
    }
  }
  // felt piano (enters at 3.33, resolves at 8.33)
  const piano = (t, m, vel, pn=0) => {
    const f = mtof(m); const out = ctx.createGain(); out.gain.value = vel;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1400 + vel*1800; lp.Q.value = 0.3;
    const p = ctx.createStereoPanner(); p.pan.value = pn; out.connect(lp); lp.connect(p); p.connect(musBus);
    for (let k=1;k<=7;k++){
      const fk = f*k*Math.sqrt(1 + 0.00035*k*k); if (fk > 9000) break;
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = fk;
      const g = ctx.createGain(); const a = 0.20/Math.pow(k, 1.5); const dec = 2.4/Math.pow(k, 0.75)*(m<50?1.4:1.0);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t+0.010); g.gain.setTargetAtTime(0, t+0.010, dec*0.45);
      o.connect(g); g.connect(out); o.start(t); o.stop(Math.min(DUR, t + dec*3));
    }
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf; const nlp = ctx.createBiquadFilter(); nlp.type='lowpass'; nlp.frequency.value = 700;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.06, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.035);
    nz.connect(nlp); nlp.connect(ng); ng.connect(out); nz.start(t, rng()*8, 0.05);
  };
  const b = beat, e = beat/2, C = TL.crest;
  const MEL = [ [C,47,0.55,-0.2],[C,66,0.50,0.15],[C+e,69,0.42,0.15],[C+2*e,74,0.48,0.15],[C+3*e,73,0.40,0.15],
    [6*b,43,0.55,-0.2],[6*b,71,0.48,0.15],[6*b+e,74,0.40,0.15],[6*b+2*e,78,0.44,0.15],[6*b+3*e,76,0.38,0.15],
    [8*b,40,0.52,-0.2],[8*b,47,0.30,-0.1],[8*b,74,0.46,0.15],[8*b+e,71,0.38,0.15],
    [9*b,45,0.50,-0.2],[9*b,76,0.42,0.15],[9*b+e,73,0.40,0.15],
    [10*b,38,0.58,-0.25],[10*b,45,0.36,-0.1],[10*b+0.04,66,0.40,0.05],[10*b+0.08,69,0.40,0.1],[10*b+0.12,74,0.46,0.15],
    [11*b,78,0.22,0.2] ];
  for (const [t,m,v,pn] of MEL) piano(t, m, v, pn);
  // soft bells
  const bell = (t, f, a, pn=0) => { const p = ctx.createStereoPanner(); p.pan.value = pn; p.connect(musBus);
    for (const [r,k,d] of [[1,1,3.2],[2.0,0.35,2.0],[2.76,0.25,1.4],[5.4,0.10,0.7]]){
      const o = ctx.createOscillator(); o.type='sine'; o.frequency.value = f*r; const g = ctx.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*k, t+0.003); g.gain.setTargetAtTime(0, t+0.003, d*0.4);
      o.connect(g); g.connect(p); o.start(t); o.stop(Math.min(DUR, t+d*2.5)); } };
  bell(TL.gust, mtof(81), 0.035, 0.3);
  bell(TL.birds, mtof(90), 0.022, 0.4);
  bell(TL.shafts, mtof(86), 0.030, -0.2); bell(TL.shafts+0.21, mtof(93), 0.018, 0.25);
  bell(TL.reappear, mtof(86), 0.032, -0.15); bell(TL.reappear+0.14, mtof(90), 0.026, 0.1); bell(TL.reappear+0.28, mtof(93), 0.022, 0.3);
  return await ctx.startRendering();
}
async function renderSoundtrackB64(){
  const buf = await renderSoundtrack(); const n = buf.length; const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const f = new Float32Array(n*2); for (let i=0;i<n;i++){ f[2*i]=L[i]; f[2*i+1]=R[i]; }
  const u8 = new Uint8Array(f.buffer); let s=''; const CH=0x8000; for (let i=0;i<u8.length;i+=CH) s += String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}

// =====================================================================
// API + PLAYER
// =====================================================================
Object.assign(window, { __scene: scene, __sky: skyCopy, __renderer: renderer, renderAt, renderFrameMB, readFrameB64, renderSoundtrack, renderSoundtrackB64, TL,
  __info: () => ({ W, H, grass: window.__grassCount, flowers: FLOWER_LIST.length, sunR: SUN_R_DEG, band:[CLOUDS.bandTop, CLOUDS.bandBot],
    sunVis: [0,5,6.67,7,7.5,8,8.33,8.8,9.5,10].map(t=>+sunVisAt(t).toFixed(3)), cam: [0,1.67,3.33,4.2,5,6.67,8.33,10].map(t=>{const c=camAt(t); return [t,+c.x.toFixed(2),+c.y.toFixed(2),+c.z.toFixed(2),+(c.yaw/DEG).toFixed(2),+(c.pitch/DEG).toFixed(2)];}),
    sun: [0,5,6.67,8.33,10].map(t=>{const s=sunAE(t); return [t,+s.az.toFixed(2),+s.el.toFixed(2)];}) }) });
window.__ready = true;
if (Q.has('t')) { renderAt(clamp(parseFloat(Q.get('t')),0,DUR)); }
else if (!Q.has('render')) {
  let start = performance.now();
  const loop = () => { const t = ((performance.now()-start)/1000) % (DUR + 1.0); renderAt(Math.min(t, DUR)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  let audio = null;
  addEventListener('click', async () => { if (audio) return; const b = await renderSoundtrack(); audio = new AudioContext();
    const buf = audio.createBuffer(2, Math.round(b.sampleRate*(DUR+1)), b.sampleRate);   // loop = film + 1 s of held silence
    buf.copyToChannel(b.getChannelData(0), 0); buf.copyToChannel(b.getChannelData(1), 1);
    const src = audio.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(audio.destination); start = performance.now(); src.start(); });
}
