const { F, el } = K;

// two-bone IK for a kit arm: returns {a, e} so the hand reaches local point (tx, ty)
function ik(rig, side, tx, ty, bend = 1) {
  const S = rig.spec, sd = side < 0 ? -1 : 1, p = rig.p;
  const th = S.thigh * (1 - 0.72 * p.sit), hipStand = -(S.thigh + S.shin + S.shoeH), hipY = -(th + S.shin + S.shoeH);
  const sx = sd * S.shoulderX, sy = S.shoulderY + (hipY - hipStand);
  const L1 = S.upperArm, L2 = S.foreArm + 8;
  const dx = tx - sx, dy = ty - sy, D = K.clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1, L1 + L2 - 0.5);
  const phiD = Math.atan2(-dx, dy), alpha = Math.acos(K.clamp((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D), -1, 1));
  const phi1 = phiD + bend * sd * alpha;
  const ex = sx - L1 * Math.sin(phi1), ey = sy + L1 * Math.cos(phi1);
  const phi2 = Math.atan2(-(tx - ex), ty - ey);
  const deg = r => r * 180 / Math.PI;
  return { a: -sd * deg(phi1), e: sd * deg(phi1 - phi2) };
}
// world target -> rig-local target
const toLocal = (rig, wx, wy) => [(wx - rig.p.x) / (rig.p.s * (rig.p.flip < 0 ? -1 : 1)), (wy - rig.p.y) / rig.p.s];
function reach(rig, side, wx, wy, pose = {}, bend = 1) {
  const q = { ...rig.p, ...pose }, save = rig.p; rig.p = q;
  const [lx, ly] = toLocal(rig, wx, wy); const r = ik(rig, side, lx, ly, bend); rig.p = save;
  return side < 0 ? { aL: r.a, eL: r.e } : { aR: r.a, eR: r.e };
}

  // ================= DANCE (x 3000): under the park lamp (autumn park)
  const dance = el('g', { class: 'dance', transform: 'translate(3000 0)' }, world);

  // ================= RAIN (x 6000): one umbrella in the rain

  SET.PARK(ctx, { parent: rain, season: 'autumn', bench: false, lamp: false, trees: [[60, 1.0], [1040, 0.9]] });
  const drops = el('g', { opacity: 0.35 }, rain);
  const rr = K.mulberry32(5);
  const R = [...Array(48)].map(() => ({ e: el('rect', { width: 3, height: 46, rx: 1.5, fill: WHITE }, drops), x: rr() * 1200 - 60, ph: rr(), sp: 1300 + rr() * 300 }));
  ctx.procs.push(t => R.forEach(d => {
    let y = 800 + ((d.ph * 880 + t * d.sp) % 880);
    const under = d.x > 300 && d.x < 780 && y > 900; // the umbrella keeps them dry

  // ================= HOME (x 10000): living room at night, inside a house

  // OUTFITS for WEDDING: HERO's jacket 2A2660 over the hoodie, BRIDE's WHITE veil

  [-1, 1].forEach(sd => el('path', { d: 'M -80 -404 Q -80 -440 -48 -440 L -24 -440 L -18 -330 L -26 -238 L -60 -238 Q -76 -238 -76 -256 Z', transform: `scale(${sd} 1)`, fill: '#2A2660' }, jacket));

    const s1 = el('rect', { x: -a.w / 2 - 1, y: -a.w / 2, width: a.w + 2, height: a.l1 + a.w / 2, rx: a.w / 2, fill: '#2A2660' }, a.g);

  const veil = el('path', { d: 'M -46 -52 Q 0 -78 46 -52 Q 96 120 108 300 Q 0 330 -108 300 Q -96 120 -46 -52 Z', fill: WHITE, opacity: 0.92 }, bride.hairBack);
  const veilTop = el('path', { d: 'M -50 -36 Q 0 -86 50 -36 Q 0 -66 -50 -36 Z', fill: WHITE }, bride.headG);

  // ================= 0.0 full CREAM contracts in 10 frames into BRIDE's dress
  const cream = el('circle', { r: 2400, fill: CREAM }, ctx.fx);
  const cr = { r: 2400 };
  ctx.procs.push(() => {
    const [wx, wy] = bride.pointWorld(bride.torso, 0, -150); const [sx, sy] = ctx.toScreen(wx, wy);

  tl.to(cr, { r: 70, duration: F(10), ease: 'expo.in' }, 0);
  tl.set(cr, { r: 0 }, F(10));
  ctx.event(0, 'whoosh');

  // 0.5 S11 — HERO nods and takes her hand
  SUB(ctx, { id: 'S11', text: 'Sen rozi boʻlding.', t0: 0.5, t1: 2.0 });
  tl.to(hero.p, { lookY: 0.7, tilt: 4, duration: F(4), ease: 'power2.out' }, 0.5);
  tl.to(hero.p, { lookY: 0, tilt: 0, duration: F(5), ease: 'power2.inOut' }, 0.5 + F(4));
  tl.to(hero.p, { lookY: 0.6, tilt: 3, duration: F(4), ease: 'power2.out' }, 0.8);
  tl.to(hero.p, { lookY: 0, tilt: 0, duration: F(5), ease: 'power2.inOut' }, 0.8 + F(4));
  const CLASP = [540, 1268];
  tl.to(hero.p, { ...reach(hero, 1, ...CLASP), duration: F(10), ease: 'expo.out' }, 1.1);
  tl.to(bride.p, { ...reach(bride, -1, CLASP[0] + 4, CLASP[1] + 4), duration: F(10), ease: 'expo.out' }, 1.25);
  ctx.event(1.4, 'touch');
  // 2.0 S12 — the ring slides on; one 4-point sparkle for 6 frames
  SUB(ctx, { id: 'S12', text: 'Turmush qurdingiz.', t0: 2.0, t1: 3.5 });
  const ringG = el('g', {}, world);
  el('path', { d: 'M -10 0 a 10 10 0 1 0 20 0 a 10 10 0 1 0 -20 0 Z M -6 0 a 6 6 0 1 1 12 0 a 6 6 0 1 1 -12 0 Z', fill: GOLD, 'fill-rule': 'evenodd' }, ringG);

  tl.to(ring, { x: CLASP[0] + 14, y: CLASP[1] + 6, duration: F(9), ease: 'expo.out' }, 2.0 - F(4));
  const spark = el('path', { d: 'M 0 -34 Q 4 -4 34 0 Q 4 4 0 34 Q -4 4 -34 0 Q -4 -4 0 -34 Z', fill: WHITE }, world);
  const sp = K.Pop(ctx, spark, 0, 0);
  ctx.procs.push(() => spark.setAttribute('transform', `translate(${CLASP[0] + 14} ${CLASP[1] + 6}) scale(${Math.max(0, sp.k)})`));
  tl.to(sp, { k: 1, duration: F(3), ease: 'expo.out' }, 2.1);

  tl.set(ring, { o: 0 }, 3.5);
  // 2.5 RICH fires a confetti popper: 30 paper bits fall, gone by 3.5
  tl.to(rich.p, { aL: 128, eL: 8, duration: F(8), ease: 'expo.out' }, 2.0);
  const popper = el('path', { d: 'M -10 0 L 10 0 L 22 -44 L -22 -44 Z', fill: GOLD }, rich.arms[0].prop);
  void popper;
  const conf = el('g', {}, world);
  const cr2 = K.mulberry32(77), P0 = [770, 960];
  const bits = [...Array(30)].map((_, i) => {

    return { e: el('rect', { x: -7, y: -4, width: 14, height: 8, rx: 2, fill: [GOLD, GREEN, CREAM, '#FEB13F', '#FD893B'][i % 5] }, conf), vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, sp: (cr2() - 0.5) * 900, ph: cr2() * 6 };
  });

      b.e.setAttribute('transform', `translate(${x} ${y}) rotate(${b.sp * dt}) scale(1 ${Math.cos(dt * 9 + b.ph)})`);

  ctx.event(2.5, 'confettiPop');

  SUB(ctx, { id: 'S13', text: 'Bir-biringizni haqiqatan sevib qoldingiz. Juda kuchli.', t0: 3.5, t1: 6.5 });

  // dance: under the park lamp
  tl.set(hero.p, { x: 3440, y: G, ...reach(hero, 1, 3540, 1000, { x: 3440 }), aL: 30, eL: 40, turn: 0.6, lookX: 0.8, tilt: 3 }, 3.5);
  tl.set(bride.p, { x: 3640, y: G, aL: 150, eL: 10, aR: 40, eR: 50, turn: -0.5, lookX: -0.7, tilt: -4, rot: -3 }, 3.5);

  tl.set(child.p, { opacity: 1, x: HX + 900, y: 1720 }, 10.5);
  tl.to(child.p, { x: HX + 900, duration: F(12), ease: 'expo.out' }, 10.5);
  tl.to(child.p, { y: G - 90, duration: F(12), ease: K.backOut(2.2) }, 11.0);
  ctx.event(11.0, 'childPop');
  K.expr(ctx, child, 'smile', 11.0, 0);
  tl.to(child.p, { aL: 150, eL: 10, aR: 150, eR: 10, duration: F(8), ease: 'expo.out' }, 11.1);
  tl.to(bride.p, { turn: 0.5, lookX: 0.9, tilt: 0, duration: F(8) }, 11.0);
  K.expr(ctx, bride, 'laugh', 11.1, F(6));

  // 11.5 S16 — close on HERO watching BRIDE lift CHILD; all but BRIDE desaturate to 30 %
  SUB(ctx, { id: 'S16', text: 'U sening borligʻing boʻlib qoldi.', t0: 11.5, t1: 14.0 });
  tl.to(bride.p, { sit: 0, x: HX + 760, duration: F(10), ease: 'expo.out' }, 11.5);
  tl.to(child.p, { x: HX + 780, y: 1300, duration: F(12), ease: 'power2.inOut' }, 11.7);
  tl.to(child.p, { aL: 70, eL: 40, aR: 70, eR: 40, duration: F(8) }, 11.8);
  tl.to(bride.p, { ...reach(bride, -1, HX + 736, 1230, { x: HX + 760, sit: 0 }), ...reach(bride, 1, HX + 826, 1236, { x: HX + 760, sit: 0 }), turn: 0.3, lookX: 0.4, lookY: 0.3, duration: F(10), ease: 'expo.out' }, 11.7);
  tl.set(childG, { attr: { 'clip-path': '' } }, 11.7);
  tl.to(hero.p, { turn: 0.6, lookX: 1, lookY: -0.2, tilt: 5, duration: F(10) }, 11.5);
  K.expr(ctx, hero, 'love', 11.8, F(10));
  K.expr(ctx, bride, 'smile', 12.2, F(8));
  [wedBulbs, homeBulbs].forEach(B => { B.out(12.0, 1); B.out(13.0, 2); });
  // desaturation filter on everything except BRIDE
  const filt = el('filter', { id: 'desat', 'color-interpolation-filters': 'sRGB' }, ctx.defs);
  const cm = el('feColorMatrix', { type: 'saturate', values: 1 }, filt);
  const ds = { k: 0 };
  ctx.procs.push(() => {
    cm.setAttribute('values', (1 - 0.7 * ds.k).toFixed(4));
    [...world.children].forEach(n => { if (n !== brideG) { if (ds.k > 0) n.setAttribute('filter', 'url(#desat)'); else n.removeAttribute('filter'); } });
  });
  tl.to(ds, { k: 1, duration: F(15), ease: 'power1.inOut' }, 11.5);

  // 14.0 pull back through the window to the house at night; tilt up; f449 = full SKY
  const house = el('g', { class: 'house' }, world);
  el('path', { d: `M ${HX - 1200} -500 L ${HX + 2300} -500 L ${HX + 2300} 2600 L ${HX - 1200} 2600 Z M ${HX - 300} 0 L ${HX - 300} 2300 L ${HX + 1400} 2300 L ${HX + 1400} 0 Z`, fill: '#544174', 'fill-rule': 'evenodd' }, house);
  el('path', { d: `M ${HX - 1500} -480 L ${HX + 550} -1900 L ${HX + 2600} -480 Z`, fill: '#794C6E' }, house);
  [[HX - 1000, 300], [HX + 1700, 300], [HX - 1000, 1300], [HX + 1700, 1300]].forEach(([x, y]) => el('rect', { x, y, width: 420, height: 600, rx: 20, fill: DUSK }, house));
  el('rect', { x: HX - 330, y: -30, width: 1760, height: 60, fill: '#794C6E' }, house);
  el('rect', { x: HX - 330, y: 2280, width: 1760, height: 60, fill: '#794C6E' }, house);
  el('rect', { x: HX - 4000, y: 2600, width: 9000, height: 3000, fill: GROUND }, house);
  const stop1 = ctx.defs.querySelector('#skyGrad stop[offset="1"]');
  const skyK = { k: 0 };
  ctx.procs.push(() => stop1.setAttribute('stop-color', K.mix(DUSK, SKY, skyK.k)));
  K.expr(ctx, hero, 'smile', 14.0, F(10));
  ctx.event(14.0, 'whooshSoft');
  tl.to(skyK, { k: 1, duration: F(24), ease: 'power1.in' }, 14.15);

  // ================= camera (one group transform)
  K.camSet(ctx, 0, { x: 540, y: 1150, s: 1.15 });                     // WEDDING
  K.camTo(ctx, 0.5, F(12), { x: 540, y: 1088, s: 1.7 }, 'expo.out');   // close on the hands 0.5-3.5
  K.camSet(ctx, 3.5, { x: 3540, y: 1130, s: 1.45 });                  // dance (locked)
  K.camSet(ctx, 4.5, { x: 6530, y: 1130, s: 1.45 });                  // umbrella (locked)
  K.camSet(ctx, 5.5, { x: 541, y: 1088, s: 1.7 });                    // foreheads (locked)
  K.camTo(ctx, 6.5, F(16), { y: 960 }, 'power2.inOut');               // tilt up to BULBS
  K.camSet(ctx, 9.5, { x: HX + 575, y: 1200, s: 1.25 });              // HOME, level
  K.camTo(ctx, 11.5, 2.4, { x: HX + 520, y: 1110, s: 1.9 }, 'power2.inOut'); // push to HERO's face
  K.camTo(ctx, 14.0, F(16), { x: HX + 550, y: 1000, s: 0.2 }, 'expo.in');   // pull out through the window
  K.camTo(ctx, 14.0 + F(14), F(15), { y: -9000 }, 'power2.in');       // tilt up
}, { seed: 303, duration: 15 });
