<!doctype html>
<html><head><meta charset="utf-8"><title>Part 2 — The Daughter</title>
<meta name="viewport" content="width=1080">
<!-- GSAP 3.12.5: cdnjs is blocked in this build environment, so the npm copy is vendored -->
<script src="vendor/gsap.min.js"></script>
</head><body>
<script type="module">
import * as K from './kit.js';
import { HERO, RICH, BRIDE, PALETTE, SUB, LABEL } from './kit.js';
const { SKY, PINK, CREAM, GOLD } = PALETTE;
const { F, el } = K;

K.boot(ctx => {
  const { tl, world } = ctx;
  void LABEL; void SKY;

  // ---------------- TERRACE: floor 2A2060, stone balustrade 544174, two GOLD wall
  // lanterns, flower boxes FEB13F, the kit skyline behind
  const T = el('g', { class: 'terrace' }, world);
  K.SKYLINE(ctx, { parent: T, y: 1300, x0: -700, x1: 1900, seed: 5 });
  el('rect', { x: -1200, y: 1380, width: 3600, height: 900, fill: '#2A2060' }, T);
  for (let x = -1200; x < 2400; x += 46) el('rect', { x: x + 12, y: 1228, width: 22, height: 130, rx: 11, fill: '#544174' }, T);
  el('rect', { x: -1200, y: 1200, width: 3600, height: 36, rx: 6, fill: '#544174' }, T);
  el('rect', { x: -1200, y: 1350, width: 3600, height: 34, fill: '#544174' }, T);
  const boxes = [[150, 330], [600, 700], [840, 1010]];
  boxes.forEach(([a, b]) => {
    const g = el('g', {}, T);
    for (let x = a + 14; x < b - 6; x += 26) { el('rect', { x: x - 3, y: 1124, width: 6, height: 36, fill: '#49B569' }, g); el('circle', { cx: x, cy: 1120, r: 13, fill: (x / 26) % 2 < 1 ? '#FD893B' : GOLD }, g); }
    el('rect', { x: a, y: 1152, width: b - a, height: 50, rx: 8, fill: '#FEB13F' }, g);
  });
  const lanterns = [[40], [1060]].map(([x]) => {
    const g = el('g', {}, T);
    el('rect', { x: x - 50, y: 960, width: 100, height: 424, fill: '#544174' }, g);
    el('rect', { x: x - 62, y: 944, width: 124, height: 26, rx: 6, fill: '#544174' }, g);
    const disc = el('circle', { cx: x, cy: 1056, r: 74, fill: GOLD, opacity: 0.3 }, g);
    el('rect', { x: x - 6, y: 1004, width: 12, height: 18, fill: '#544174' }, g);
    el('path', { d: `M ${x - 28} 1024 L ${x + 28} 1024 L ${x + 18} 1012 L ${x - 18} 1012 Z`, fill: '#544174' }, g);
    const body = el('rect', { x: x - 22, y: 1024, width: 44, height: 58, rx: 8, fill: GOLD }, g);
    el('rect', { x: x - 26, y: 1080, width: 52, height: 10, rx: 4, fill: '#544174' }, g);
    return { disc, body };
  });
  const lamp = { k: 1 };
  ctx.procs.push(() => lanterns.forEach(l => { l.body.setAttribute('fill', K.mix('#544174', GOLD, lamp.k)); l.disc.setAttribute('opacity', 0.3 * lamp.k); }));

  // ---------------- characters (from kit.js, unchanged)
  const G = 1580;
  const hb = el('g', {}, world);            // heartbeat line sits behind RICH
  const back = el('g', {}, world);
  const front = el('g', {}, world);
  const bride = BRIDE(ctx, { parent: back, expr: 'neutral', pose: { x: 760, y: 1440, s: 0.92, turn: -1.5, lookX: -1, sx: 0.9, aL: 10, eL: 14, aR: 10, eR: 14 } });
  const rich = RICH(ctx, { parent: front, expr: 'smile', pose: { x: 540, y: G, turn: 0.4, lookX: 0.6 } });
  const hero = HERO(ctx, { parent: front, expr: 'neutral', pose: { x: 300, y: G, turn: 0.6, lookX: 1 } });
  // hair swings as she turns (transforming her existing hair group, not redrawing it)
  ctx.procs.push(t => { const d = Math.exp(-t * 2.2), a = t < 3 ? 9 * Math.sin(t * 9) * d : 0; bride.hairBack.setAttribute('transform', `rotate(${a})`); });

  // watering can in BRIDE's right hand
  const can = el('g', {}, bride.arms[1].prop);
  const canIn = el('g', { transform: 'translate(10 4)' }, can);
  el('rect', { x: -8, y: 0, width: 56, height: 44, rx: 8, fill: '#544174' }, canIn);
  el('path', { d: 'M 46 14 L 92 -10 L 96 -2 L 50 26 Z', fill: '#544174' }, canIn);
  el('rect', { x: 0, y: -12, width: 32, height: 14, rx: 7, fill: '#544174' }, canIn);
  const cst = { o: 0, tip: 0 };
  ctx.procs.push(() => { can.setAttribute('opacity', cst.o); canIn.setAttribute('transform', `translate(10 4) rotate(${cst.tip})`); });

  // ---------------- 0.0  full GOLD slides off left in 10 frames, reveals TERRACE
  const gold = el('rect', { x: 0, y: 0, width: 1080, height: 1920, fill: GOLD }, ctx.fx);
  const gs = { x: 0 };
  ctx.procs.push(() => gold.setAttribute('x', gs.x));
  tl.to(gs, { x: -1081, duration: F(10), ease: 'expo.in' }, F(1));
  ctx.event(0, 'whoosh');
  // BRIDE mid-turn towards the camera, hair swinging; face revealed by 1.0, smile
  tl.to(bride.p, { turn: 0, lookX: 0, sx: 1, duration: 1.0, ease: 'expo.out' }, 0);
  K.expr(ctx, bride, 'smile', 0.8, F(8));

  // 0.5 S6
  SUB(ctx, { id: 'S6', text: 'Lekin uchrashgach koʻrding: u juda chiroyli.', t0: 0.5, t1: 3.0 });
  // 1.5 cut to HERO: love, cheeks 1.4x
  tl.set(hero.p, { turn: 0.3, lookX: 0.6 }, 1.5);
  K.expr(ctx, hero, 'love', 1.5, F(6), 'expo.out');
  ctx.event(1.5, 'cut');
  // 2.0 the MARK bubble from part 1 reappears over him and cracks apart in 4 frames
  const BX = 445, BY = 978, BS = 0.42;
  const halves = [-1, 1].map(sd => {
    const outer = el('g', {}, world);
    const mb = K.MARKBUBBLE(ctx, { parent: outer, w: 380, h: 330 });
    const clip = el('clipPath', { id: 'half' + sd, clipPathUnits: 'userSpaceOnUse' }, ctx.defs);
    el('path', { d: sd < 0 ? 'M -400 -400 L 12 -400 L -14 -120 L 22 -30 L -12 60 L 16 400 L -400 400 Z' : 'M 400 -400 L 12 -400 L -14 -120 L 22 -30 L -12 60 L 16 400 L 400 400 Z' }, clip);
    mb.inner.setAttribute('clip-path', `url(#half${sd})`);
    const st = { dx: 0, dy: 0, r: 0 };
    ctx.procs.push(t => mb.g.setAttribute('transform', `translate(${BX + st.dx} ${BY + st.dy}) scale(${BS}) rotate(${st.r + 3 * Math.sin(t * Math.PI * 2)})`));
    tl.to(st, { dx: sd * 60, dy: 50, r: sd * 16, duration: F(4), ease: 'power2.in' }, 2.4);
    return { outer, st };
  });
  const crackPop = halves.map(h => K.Pop(ctx, h.outer, 330, 1010));
  crackPop.forEach(st => { K.pop(ctx, st, 2.0, { z: 0.55, dur: 0.35 }); tl.to(st, { o: 0, duration: F(4), ease: 'power2.in' }, 2.4); });
  ctx.event(2.4, 'glassCrack');

  // 3.0 S7 — wide three-shot: HERO looks from BRIDE to RICH, doubt; small MARK at 3.5
  SUB(ctx, { id: 'S7', text: 'Nega boy bunday qilyapti? Qizida nimadir bormi?', t0: 3.0, t1: 6.0 });
  tl.set(hero.p, { ...hero.exprs.neutral, turn: 0.6, lookX: 1 }, 3.0);
  tl.set(bride.p, { turn: 0.8, lookX: 0.6, lookY: 0.6, aR: 34, eR: 50 }, 3.0);
  tl.set(cst, { o: 1, tip: 18 }, 3.0);
  tl.to(cst, { tip: 34, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 3.0);
  K.expr(ctx, bride, 'soft', 3.0, 0);
  K.expr(ctx, hero, 'doubt', 3.2, F(8));
  tl.to(hero.p, { turn: -0.2, lookX: -0.2, duration: F(10), ease: 'expo.out' }, 3.9);
  const markG = el('g', {}, world);
  const mt = el('text', { x: 300, y: 940, 'text-anchor': 'middle', fill: CREAM, 'font-family': 'Inter', 'font-weight': 800, 'font-size': 90 }, markG);
  mt.textContent = '?';
  const mst = K.Pop(ctx, markG, 300, 930);
  K.pop(ctx, mst, 3.5, { z: 0.55, dur: 0.4 });
  ctx.event(3.5, 'bubblePop');
  tl.to(mst, { k: 0, duration: F(6), ease: 'expo.in' }, 5.8);
  // 5.0 RICH's smile drops, he looks down
  K.expr(ctx, rich, 'neutral', 5.0, F(8));
  tl.to(rich.p, { lookY: 1, lookX: 0, turn: 0, tilt: 5, duration: F(12), ease: 'expo.out' }, 5.1);

  // 6.0 S8 — close on RICH, sad; lanterns dim to 40 %; PINK heartbeat line behind him
  SUB(ctx, { id: 'S8', text: '“Qizim ogʻir kasal.”', t0: 6.0, t1: 8.0, color: GOLD });
  K.expr(ctx, rich, 'sad', 6.0, F(6));
  tl.set(rich.p, { tilt: 3 }, 6.0);
  tl.to(lamp, { k: 0.4, duration: F(15), ease: 'power1.out' }, 6.0);
  let d = 'M 290 1010', x = 290; const amps = [1, 0.7, 0.45, 0.22], peaks = [];
  amps.forEach(a => { d += ` L ${x += 40} 1010 L ${x += 14} ${1010 - 16 * a} L ${x += 14} 1010 L ${x += 12} 1010 L ${x += 12} ${1010 - 110 * a} L ${x += 14} ${1010 + 44 * a} L ${x += 12} 1010`; peaks.push(x - 26); });
  d += ` L 800 1010`;
  const heart = el('path', { d, fill: 'none', stroke: PINK, 'stroke-width': 7, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'heartbeat' }, hb);
  const L = heart.getTotalLength();
  heart.setAttribute('stroke-dasharray', `${L} ${L}`);
  const hs = { off: L, o: 0 };
  ctx.procs.push(() => { heart.setAttribute('stroke-dashoffset', hs.off); heart.setAttribute('opacity', hs.o); });
  tl.set(hs, { o: 1 }, 6.0);
  tl.to(hs, { off: 0, duration: 1.0, ease: 'none' }, 6.0);
  tl.set(hs, { o: 0 }, 8.0);
  peaks.slice(0, 2).forEach(px => ctx.event(6.0 + (px - 290) / 510 * 1.0, 'heartbeat'));
  // hide the doubt / can props off-shot
  tl.set(cst, { o: 0 }, 6.0);
  tl.set(bride.p, { aR: 10, eR: 14, turn: -0.9, lookX: -0.9, lookY: -0.5 }, 6.0);
  K.expr(ctx, bride, 'neutral', 6.0, 0);
  // HERO moves to watch from behind (off-shot)
  tl.set(hero.p, { x: 1000, y: 1600, turn: -0.7, lookX: -1, lookY: -0.3 }, 6.0);
  K.expr(ctx, hero, 'neutral', 6.0, 0);

  // 8.0 S9 — BRIDE at the balustrade watching the skyline; CREAM thought bubble y 520-900
  SUB(ctx, { id: 'S9', text: '“Bitta orzusi bor: turmush qurish, oilali boʻlish…”', t0: 8.0, t1: 11.0, color: GOLD });
  // the thought bubble lives in screen space so it always sits at y 520-900, clear of the SUB
  const thought = el('g', {}, ctx.fx);
  const TX = 540, TY = 712, TW = 620, TH = 250;
  const cloudG = el('g', {}, thought);
  const cloudParts = [el('ellipse', { cx: TX, cy: TY, rx: TW / 2, ry: TH / 2, fill: CREAM }, cloudG)];
  [[-0.36, -0.4, 74], [-0.04, -0.46, 80], [0.3, -0.4, 76], [0.44, 0.02, 72], [0.3, 0.4, 72], [-0.04, 0.44, 72], [-0.36, 0.38, 72], [-0.46, 0, 70]]
    .forEach(([a, b, r]) => cloudParts.push(el('circle', { cx: TX + a * TW, cy: TY + b * TH, r, fill: CREAM }, cloudG)));
  [[676, 912, 15], [690, 940, 10]].forEach(([cx, cy, r]) => cloudParts.push(el('circle', { cx, cy, r, fill: CREAM }, cloudG)));
  const warm = { k: 0 };
  ctx.procs.push(() => cloudParts.forEach(c => c.setAttribute('fill', K.mix(CREAM, GOLD, 0.2 * warm.k))));
  const tst = K.Pop(ctx, thought, 600, 860);
  K.pop(ctx, tst, 8.0, { z: 0.55, dur: 0.6 });
  ctx.event(8.0, 'bubbleSpring');
  const icons = ['rings', 'house', 'crib', 'sun'].map((n, i) => {
    const ix = TX + (i - 1.5) * 140, g = el('g', {}, thought);
    K.ICON(n, g, { x: ix, y: TY, size: 120 });
    const st = K.Pop(ctx, g, ix, TY);
    const t0 = [8.5, 9.0, 9.5, 11.5][i];
    K.pop(ctx, st, t0, { z: 0.55, dur: 0.4 });
    ctx.event(t0, 'chime', { i });
    return st;
  });
  void icons;
  tl.to(bride.p, { aL: 14, eL: 40, duration: F(10), ease: 'expo.out' }, 8.2);

  // 11.0 S10 — sun icon at 11.5, bubble warms 20 % towards GOLD; BRIDE soft
  SUB(ctx, { id: 'S10', text: '“…va baxtli hayot kechirish.”', t0: 11.0, t1: 14.5, color: GOLD });
  tl.to(warm, { k: 1, duration: F(12), ease: 'power1.out' }, 11.5);
  K.expr(ctx, bride, 'soft', 11.2, F(10));

  // 13.0 the bubble folds away; HERO breathes in, steps forward, holds out his hand at 14.0
  tl.to(tst, { k: 0, duration: F(8), ease: 'expo.in' }, 13.0);
  ctx.event(13.0, 'whooshSoft');
  tl.to(hero.p, { sy: 1.03, sx: 0.98, duration: F(4), ease: 'power2.out' }, 13.13);
  tl.to(hero.p, { x: 940, y: 1474, s: 0.94, sx: 1, sy: 1, walk: 1, walkAmp: 1, duration: 0.5, ease: 'power1.inOut' }, 13.27);
  tl.set(hero.p, { walkAmp: 0, walk: 0 }, 13.77);
  K.land(ctx, hero, 13.77, 1.08, 0.92);
  ctx.event(13.52, 'step'); ctx.event(13.77, 'step');
  K.expr(ctx, hero, 'smile', 13.8, F(8));
  tl.to(hero.p, { aL: 26, eL: 32, duration: F(6), ease: 'expo.out' }, 13.87);
  tl.to(bride.p, { turn: 0.7, lookX: 0.8, lookY: 0.2, aL: 10, eL: 14, duration: F(10), ease: 'expo.out' }, 13.8);
  K.expr(ctx, bride, 'smile', 14.0, F(8));
  // 14.5 her hand meets his on the beat; a CREAM circle grows from the clasp
  tl.to(bride.p, { aR: 30, eR: 4, duration: F(6), ease: 'expo.out' }, 14.3);
  const circ = el('circle', { r: 0, fill: CREAM }, ctx.fx);
  const cc = { r: 0 };
  ctx.procs.push(() => { const [hx, hy] = hero.handWorld(-1); const [sx, sy] = ctx.toScreen(hx, hy); circ.setAttribute('cx', sx); circ.setAttribute('cy', sy); circ.setAttribute('r', cc.r); });
  tl.to(cc, { r: 2400, duration: F(13), ease: 'expo.in' }, 14.5);
  ctx.event(14.5, 'clasp');

  // ---------------- camera
  K.camSet(ctx, 0, { x: 760, y: 1150, s: 1.6 });                   // medium on BRIDE
  K.camSet(ctx, 1.5, { x: 330, y: 1100, s: 2.1 });                 // cut to HERO
  K.camTo(ctx, 3.0, F(18), { x: 560, y: 1240, s: 1.25 }, 'expo.out'); // pull wide: three-shot
  K.camSet(ctx, 6.0, { x: 540, y: 1080, s: 2.3 });                 // close on RICH
  K.camTo(ctx, 8.0, 0.8, { x: 720, y: 980, s: 1.5 }, 'power3.out'); // drift to BRIDE
  K.camTo(ctx, 8.8, 4.2, { s: 1.53 }, 'none');                     // 2 % push
  K.camTo(ctx, 13.0, 1.0, { x: 850, y: 1150, s: 1.6 }, 'power2.inOut'); // settle on the hands
}, { seed: 202, duration: 15 });
</script>
</body></html>
